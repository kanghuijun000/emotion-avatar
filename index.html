<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Natural Emotion Intensity Avatar</title>

<script src="https://js.puter.com/v2/"></script>

<style>
* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

:root {
    --bg: #090d18;
    --panel: #131b2b;
    --panel2: #1a2539;
    --text: #edf3ff;
    --muted: #94a3b8;
    --accent: #7c9cff;
    --border: rgba(255,255,255,.09);
}

body {
    margin: 0;
    background:
        radial-gradient(circle at top, #1c2946 0%, #090d18 55%);
    color: var(--text);
    font-family: Arial, "Malgun Gothic", sans-serif;
    min-height: 100vh;
}

button, input, textarea {
    font: inherit;
}

button {
    cursor: pointer;
}

.app {
    width: 100%;
    max-width: 1100px;
    margin: auto;
    padding: 18px;
}

header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 18px;
}

.logo {
    font-size: 21px;
    font-weight: 800;
    letter-spacing: -.5px;
}

.logo span {
    color: var(--accent);
}

.header-actions {
    display: flex;
    gap: 8px;
}

.small-btn {
    background: var(--panel2);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 9px 13px;
    border-radius: 10px;
}

.layout {
    display: grid;
    grid-template-columns: minmax(0, .95fr) minmax(0, 1.05fr);
    gap: 18px;
}

.panel {
    background: rgba(19,27,43,.92);
    border: 1px solid var(--border);
    border-radius: 20px;
    overflow: hidden;
    box-shadow: 0 15px 50px rgba(0,0,0,.18);
}

.panel-title {
    font-size: 15px;
    font-weight: 700;
    padding: 17px 18px;
    border-bottom: 1px solid var(--border);
}

.avatar-area {
    padding: 20px;
}

.avatar-stage {
    position: relative;
    min-height: 310px;
    display: flex;
    align-items: center;
    justify-content: center;
    background:
        radial-gradient(circle at 50% 45%, #273b62 0%, #131c30 55%, #101827 100%);
    border-radius: 16px;
    overflow: hidden;
}

#avatarCanvas {
    width: 100%;
    max-width: 380px;
    height: 310px;
    display: block;
}

.state-badge {
    position: absolute;
    top: 14px;
    left: 14px;
    padding: 7px 11px;
    background: rgba(0,0,0,.3);
    border: 1px solid rgba(255,255,255,.12);
    border-radius: 30px;
    font-size: 12px;
    color: #dce7ff;
}

.emotion-main {
    margin-top: 18px;
    padding: 15px;
    border-radius: 14px;
    background: var(--panel2);
}

.emotion-main-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
}

.emotion-main-name {
    font-size: 18px;
    font-weight: 800;
}

.emotion-main-value {
    font-size: 24px;
    font-weight: 800;
}

.progress {
    height: 9px;
    background: #0b1220;
    border-radius: 10px;
    overflow: hidden;
}

.progress-fill {
    height: 100%;
    width: 0%;
    border-radius: inherit;
    transition: width .35s ease, background .35s ease;
}

.emotion-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0,1fr));
    gap: 10px;
    margin-top: 15px;
}

.emotion-card {
    background: var(--panel2);
    padding: 12px;
    border-radius: 12px;
    border: 1px solid transparent;
}

.emotion-card-top {
    display: flex;
    justify-content: space-between;
    gap: 8px;
    font-size: 13px;
    margin-bottom: 9px;
}

.emotion-card-value {
    color: #dbe5ff;
    font-weight: 700;
}

.emotion-card .progress {
    height: 6px;
}

.emotion-note {
    margin-top: 14px;
    color: var(--muted);
    font-size: 12px;
    line-height: 1.6;
}

.chat-panel {
    display: flex;
    flex-direction: column;
    min-height: 650px;
}

.chat-status {
    display: flex;
    align-items: center;
    gap: 8px;
    color: var(--muted);
    font-size: 12px;
    padding: 12px 18px;
    border-bottom: 1px solid var(--border);
}

.status-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #55d69e;
}

.chat-messages {
    flex: 1;
    min-height: 350px;
    max-height: 620px;
    overflow-y: auto;
    padding: 18px;
    display: flex;
    flex-direction: column;
    gap: 15px;
}

.message {
    max-width: 92%;
    padding: 13px 15px;
    border-radius: 15px;
    font-size: 14px;
    line-height: 1.7;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
}

.message.user {
    align-self: flex-end;
    background: #526fd0;
    color: white;
    border-bottom-right-radius: 5px;
}

.message.ai {
    align-self: flex-start;
    background: #202c42;
    color: #edf3ff;
    border-bottom-left-radius: 5px;
}

.message.system {
    align-self: center;
    background: rgba(255,255,255,.06);
    color: var(--muted);
    font-size: 12px;
    text-align: center;
}

.message-label {
    font-size: 11px;
    color: #9eafd0;
    margin-bottom: 5px;
    font-weight: 700;
}

.typing {
    color: #9eafd0;
    font-size: 13px;
    padding: 0 18px 14px;
    display: none;
}

.input-area {
    padding: 15px;
    border-top: 1px solid var(--border);
    background: rgba(10,16,28,.5);
}

.input-row {
    display: flex;
    gap: 10px;
    align-items: flex-end;
}

#userInput {
    flex: 1;
    min-width: 0;
    min-height: 48px;
    max-height: 150px;
    resize: none;
    border-radius: 13px;
    padding: 13px 14px;
    color: var(--text);
    background: #0c1424;
    border: 1px solid var(--border);
    outline: none;
    line-height: 1.5;
}

#userInput:focus {
    border-color: #6f8fe9;
}

#sendBtn {
    min-width: 75px;
    height: 48px;
    border: 0;
    border-radius: 13px;
    background: #6f8fe9;
    color: white;
    font-weight: 800;
}

#sendBtn:disabled {
    opacity: .45;
    cursor: not-allowed;
}

.input-hint {
    font-size: 11px;
    color: #71819d;
    margin-top: 9px;
}

@media (max-width: 760px) {
    .app {
        padding: 12px;
    }

    .layout {
        grid-template-columns: 1fr;
    }

    .chat-panel {
        min-height: 570px;
    }

    .chat-messages {
        min-height: 330px;
        max-height: 520px;
    }

    .avatar-stage {
        min-height: 270px;
    }

    #avatarCanvas {
        height: 270px;
    }

    .logo {
        font-size: 17px;
    }
}
</style>
</head>

<body>

<div class="app">

    <header>
        <div class="logo">
            Natural <span>Emotion</span> Avatar
        </div>

        <div class="header-actions">
            <button class="small-btn" id="resetBtn">감정 초기화</button>
        </div>
    </header>

    <main class="layout">

        <!-- 감정 아바타 -->

        <section class="panel">

            <div class="panel-title">AI 감정 상태</div>

            <div class="avatar-area">

                <div class="avatar-stage">

                    <div class="state-badge" id="stateBadge">
                        평온
                    </div>

                    <canvas id="avatarCanvas"></canvas>

                </div>

                <div class="emotion-main">

                    <div class="emotion-main-top">
                        <div class="emotion-main-name" id="mainEmotionName">
                            😐 평온
                        </div>

                        <div class="emotion-main-value" id="mainEmotionValue">
                            0%
                        </div>
                    </div>

                    <div class="progress">
                        <div class="progress-fill" id="mainEmotionBar"></div>
                    </div>

                </div>

                <div class="emotion-grid" id="emotionGrid"></div>

                <div class="emotion-note" id="emotionNote">
                    AI의 감정은 대화의 문맥과 이전 감정 상태에 따라 변화합니다.
                </div>

            </div>

        </section>

        <!-- 대화창 -->

        <section class="panel chat-panel">

            <div class="panel-title">AI 감정 대화</div>

            <div class="chat-status">
                <div class="status-dot" id="statusDot"></div>
                <span id="statusText">대화 준비 완료</span>
            </div>

            <div class="chat-messages" id="chatMessages">

                <div class="message ai">
                    <div class="message-label">AI</div>
                    안녕. 오늘은 어떤 이야기를 하고 싶어?
                </div>

            </div>

            <div class="typing" id="typingIndicator">
                AI가 답변을 생성하고 있어...
            </div>

            <div class="input-area">

                <div class="input-row">

                    <textarea
                        id="userInput"
                        placeholder="메시지를 입력하세요..."
                        rows="1"
                    ></textarea>

                    <button id="sendBtn">전송</button>

                </div>

                <div class="input-hint">
                    Enter: 전송 · Shift + Enter: 줄바꿈
                </div>

            </div>

        </section>

    </main>

</div>

<script>
"use strict";

/* =========================================================
   1. 감정 시스템 기본 설정
========================================================= */

const EMOTION_NAMES = {
    anger: "분노",
    joy: "기쁨",
    sadness: "슬픔",
    disgust: "불쾌감",
    fear: "불안",
    surprise: "놀람",
    calm: "평온"
};

const EMOTION_EMOJI = {
    anger: "😠",
    joy: "😄",
    sadness: "😢",
    disgust: "😒",
    fear: "😨",
    surprise: "😮",
    calm: "😐"
};

const EMOTION_COLORS = {
    anger: "#ff4e59",
    joy: "#ffd166",
    sadness: "#6198ff",
    disgust: "#b18cff",
    fear: "#6ed9cc",
    surprise: "#ff9f43",
    calm: "#8da5c9"
};

const DEFAULT_EMOTIONS = {
    anger: 0,
    joy: 0,
    sadness: 0,
    disgust: 0,
    fear: 0,
    surprise: 0,
    calm: 100
};

let emotions = { ...DEFAULT_EMOTIONS };

let chatHistory = [];

let isGenerating = false;

let lastEmotionUpdate = Date.now();

let currentExpression = "calm";

let conversationTurn = 0;

let lastAngerEvent = 0;

let consecutiveInsults = 0;

let recentOffenses = [];

let lastUserMessage = "";

let lastAssistantReply = "";

let angerResistance = 0;


/* =========================================================
   2. DOM 요소
========================================================= */

const $ = id => document.getElementById(id);

const chatMessages = $("chatMessages");
const userInput = $("userInput");
const sendBtn = $("sendBtn");

const typingIndicator = $("typingIndicator");

const statusText = $("statusText");
const statusDot = $("statusDot");

const emotionGrid = $("emotionGrid");

const mainEmotionName = $("mainEmotionName");
const mainEmotionValue = $("mainEmotionValue");
const mainEmotionBar = $("mainEmotionBar");

const stateBadge = $("stateBadge");
const emotionNote = $("emotionNote");


/* =========================================================
   3. 감정 계산 보조 함수
========================================================= */

function clamp(value, min = 0, max = 100) {
    return Math.max(min, Math.min(max, value));
}

function round(value) {
    return Math.round(value);
}

function getDominantEmotion() {
    let dominant = "calm";
    let max = -1;

    for (const key of Object.keys(emotions)) {
        if (key === "calm") continue;

        if (emotions[key] > max) {
            max = emotions[key];
            dominant = key;
        }
    }

    if (max < 8) return "calm";

    return dominant;
}

function getAngerLevel() {
    return emotions.anger;
}

function getAngerStage() {
    const anger = getAngerLevel();

    if (anger >= 95) return "extreme";
    if (anger >= 80) return "furious";
    if (anger >= 60) return "angry";
    if (anger >= 40) return "irritated";
    if (anger >= 20) return "annoyed";

    return "calm";
}

function getAngerStageText() {
    const stage = getAngerStage();

    const map = {
        calm: "평온",
        annoyed: "짜증",
        irritated: "불쾌",
        angry: "분노",
        furious: "격분",
        extreme: "극도의 분노"
    };

    return map[stage];
}


/* =========================================================
   4. 감정 수치 정규화
========================================================= */

function normalizeEmotions() {
    for (const key of Object.keys(EMOTION_NAMES)) {
        emotions[key] = clamp(Number(emotions[key]) || 0);
    }

    const total = Object.values(emotions).reduce(
        (sum, value) => sum + value,
        0
    );

    if (total <= 0) {
        emotions = { ...DEFAULT_EMOTIONS };
        return;
    }

    const normalized = {};

    for (const key of Object.keys(EMOTION_NAMES)) {
        normalized[key] = emotions[key] / total * 100;
    }

    emotions = normalized;
}


/* =========================================================
   5. 감정 수치 조정
========================================================= */

function setEmotion(key, value) {
    if (!(key in emotions)) return;

    emotions[key] = clamp(value);
}

function addEmotion(key, amount) {
    if (!(key in emotions)) return;

    emotions[key] = clamp(emotions[key] + amount);
}


/* =========================================================
   6. 감정 상태 유지
========================================================= */

function preserveAnger(previousAnger, minimumAnger) {
    /*
      AI가 감정을 분석하면서 분노를 임의로 낮추지 못하도록
      현재 턴에서 계산된 최소 분노를 보장한다.
    */

    emotions.anger = Math.max(
        emotions.anger,
        previousAnger,
        minimumAnger
    );

    emotions.anger = clamp(emotions.anger);
}


/* =========================================================
   7. 메시지 분석
========================================================= */

function analyzeMessageLocally(message) {

    const text = message.toLowerCase().trim();

    const result = {
        insult: 0,
        hostility: 0,
        apology: 0,
        praise: 0,
        positive: 0,
        sadness: 0,
        fear: 0,
        surprise: 0,
        frustration: 0,
        directedAtAI: false,
        repeated: false
    };

    /*
      욕설 및 모욕 표현
      단어 하나만으로 모든 상황을 판단하지 않고,
      문맥 분석 결과와 함께 사용한다.
    */

    const insultPatterns = [
        /병신/,
        /븅신/,
        /개새끼/,
        /씨발/,
        /시발/,
        /좆같/,
        /쓰레기/,
        /멍청이/,
        /한심/,
        /꺼져/,
        /닥쳐/,
        /무능/,
        /쓸모없/,
        /역겹/,
        /재수없/
    ];

    let insultCount = 0;

    for (const pattern of insultPatterns) {
        const matches = text.match(new RegExp(
            pattern.source,
            "g"
        ));

        if (matches) {
            insultCount += matches.length;
        }
    }

    result.insult = clamp(insultCount * 22, 0, 100);

    /*
      공격적 표현
    */

    const hostilePatterns = [
        /너는.*(병신|멍청|쓸모없|한심)/,
        /(너|니가|네가).*(꺼져|닥쳐)/,
        /너.*재수없/,
        /너.*역겨/,
        /너.*쓰레기/
    ];

    for (const pattern of hostilePatterns) {
        if (pattern.test(text)) {
            result.hostility = Math.max(
                result.hostility,
                65
            );
        }
    }

    /*
      사과
    */

    const apologyPatterns = [
        /미안/,
        /미안해/,
        /미안하다/,
        /사과할게/,
        /사과해/,
        /내가 잘못/,
        /잘못했어/,
        /용서해/,
        /미안합니다/
    ];

    for (const pattern of apologyPatterns) {
        if (pattern.test(text)) {
            result.apology = 1;
            break;
        }
    }

    /*
      칭찬 및 긍정적 표현
    */

    const praisePatterns = [
        /고마워/,
        /고맙/,
        /잘했/,
        /좋아/,
        /최고/,
        /대단/,
        /멋지/,
        /훌륭/,
        /똑똑/,
        /도움이 됐/,
        /감사/,
        /사랑해/
    ];

    for (const pattern of praisePatterns) {
        if (pattern.test(text)) {
            result.praise = 1;
            break;
        }
    }

    /*
      긍정적 감정
    */

    const positivePatterns = [
        /행복/,
        /기쁘/,
        /즐거/,
        /신나/,
        /좋은 하루/,
        /기분이 좋/
    ];

    for (const pattern of positivePatterns) {
        if (pattern.test(text)) {
            result.positive = 1;
            break;
        }
    }

    /*
      슬픔
    */

    const sadnessPatterns = [
        /슬퍼/,
        /우울/,
        /외로/,
        /힘들/,
        /괴로/,
        /속상/,
        /눈물/,
        /상실/
    ];

    for (const pattern of sadnessPatterns) {
        if (pattern.test(text)) {
            result.sadness = 1;
            break;
        }
    }

    /*
      불안
    */

    const fearPatterns = [
        /무서/,
        /두려/,
        /불안/,
        /걱정/,
        /겁나/,
        /떨려/
    ];

    for (const pattern of fearPatterns) {
        if (pattern.test(text)) {
            result.fear = 1;
            break;
        }
    }

    /*
      놀람
    */

    const surprisePatterns = [
        /헐/,
        /대박/,
        /놀랐/,
        /충격/,
        /진짜\?/,
        /뭐라고\?/
    ];

    for (const pattern of surprisePatterns) {
        if (pattern.test(text)) {
            result.surprise = 1;
            break;
        }
    }

    /*
      답답함과 좌절
    */

    const frustrationPatterns = [
        /짜증/,
        /답답/,
        /화나/,
        /열받/,
        /빡치/,
        /미치겠/,
        /왜.*안/,
        /또.*오류/,
        /작동.*안/
    ];

    for (const pattern of frustrationPatterns) {
        if (pattern.test(text)) {
            result.frustration = 1;
            break;
        }
    }

    /*
      AI를 직접 향한 발언인지 추정
    */

    const aiDirectedPatterns = [
        /너/,
        /니가/,
        /네가/,
        /너는/,
        /너한테/,
        /ai/,
        /인공지능/,
        /챗지피티/,
        /너희/
    ];

    result.directedAtAI = aiDirectedPatterns.some(
        pattern => pattern.test(text)
    );

    /*
      반복 입력 확인
    */

    if (lastUserMessage) {
        const normalizedCurrent = text.replace(/\s+/g, "");
        const normalizedPrevious = lastUserMessage
            .toLowerCase()
            .replace(/\s+/g, "");

        if (
            normalizedCurrent === normalizedPrevious &&
            result.insult > 0
        ) {
            result.repeated = true;
        }
    }

    return result;
}


/* =========================================================
   8. 감정 누적 및 회복
========================================================= */

function updateEmotionFromMessage(message) {

    const analysis = analyzeMessageLocally(message);

    const previousAnger = emotions.anger;

    let angerIncrease = 0;

    /*
      공격적인 발언에 대한 분노 증가
    */

    if (analysis.insult > 0) {

        angerIncrease += analysis.insult * 0.38;

        if (analysis.hostility > 0) {
            angerIncrease += analysis.hostility * 0.20;
        }

        if (analysis.directedAtAI) {
            angerIncrease += 8;
        }

        if (analysis.repeated) {
            angerIncrease += 12;
        }

        consecutiveInsults++;

        /*
          반복적으로 모욕할수록 추가 누적
        */

        if (consecutiveInsults >= 2) {
            angerIncrease += Math.min(
                consecutiveInsults * 3,
                18
            );
        }

        angerResistance = Math.min(
            angerResistance + 8,
            35
        );

        recentOffenses.push({
            time: Date.now(),
            amount: angerIncrease
        });

        if (recentOffenses.length > 30) {
            recentOffenses.shift();
        }

        lastAngerEvent = Date.now();

    } else if (analysis.frustration) {

        /*
          단순한 짜증은 모욕보다 낮은 강도로 반영
        */

        angerIncrease += 4;

        addEmotion("disgust", 4);

    } else if (analysis.apology) {

        /*
          사과는 분노 회복에 영향을 주지만
          즉시 초기화하지 않는다.
        */

        emotions.anger = Math.max(
            0,
            emotions.anger - 16
        );

        emotions.disgust = Math.max(
            0,
            emotions.disgust - 8
        );

        consecutiveInsults = Math.max(
            0,
            consecutiveInsults - 2
        );

        angerResistance = Math.max(
            0,
            angerResistance - 12
        );

    } else {

        /*
          공격이 없는 일반 대화에서는
          분노를 아주 조금씩 회복한다.
        */

        const recovery = emotions.anger > 80 ? 0.3 :
                         emotions.anger > 50 ? 0.7 :
                         emotions.anger > 20 ? 1.2 :
                         1.5;

        emotions.anger = Math.max(
            0,
            emotions.anger - recovery
        );

        consecutiveInsults = Math.max(
            0,
            consecutiveInsults - 0.15
        );
    }

    /*
      분노 증가량에 누적 저항을 반영
    */

    if (angerIncrease > 0) {

        const adjustedIncrease = Math.max(
            2,
            angerIncrease - angerResistance * 0.15
        );

        emotions.anger = clamp(
            emotions.anger + adjustedIncrease
        );

        addEmotion("disgust", adjustedIncrease * 0.30);

        addEmotion("sadness", adjustedIncrease * 0.06);
    }

    /*
      기쁨
    */

    if (analysis.praise || analysis.positive) {

        addEmotion(
            "joy",
            analysis.praise ? 12 : 8
        );

        if (emotions.anger < 40) {
            emotions.anger = Math.max(
                0,
                emotions.anger - 3
            );
        }
    }

    /*
      슬픔
    */

    if (analysis.sadness) {
        addEmotion("sadness", 15);
    }

    /*
      불안
    */

    if (analysis.fear) {
        addEmotion("fear", 12);
    }

    /*
      놀람
    */

    if (analysis.surprise) {
        addEmotion("surprise", 15);
    }

    /*
      평온은 다른 감정이 높아질수록 감소
    */

    emotions.calm = Math.max(
        0,
        100 - (
            emotions.anger * 0.85 +
            emotions.joy * 0.35 +
            emotions.sadness * 0.50 +
            emotions.disgust * 0.65 +
            emotions.fear * 0.45 +
            emotions.surprise * 0.35
        )
    );

    /*
      분노는 이전 상태보다 임의로 낮아지지 않도록
      현재 입력의 최소 분노를 유지한다.
    */

    if (analysis.insult > 0) {

        preserveAnger(
            previousAnger,
            previousAnger + 2
        );
    }

    normalizeEmotions();

    return analysis;
}


/* =========================================================
   9. 시간에 따른 감정 회복
========================================================= */

function updateEmotionDecay() {

    const now = Date.now();

    const elapsed = Math.max(
        0,
        (now - lastEmotionUpdate) / 1000
    );

    lastEmotionUpdate = now;

    if (elapsed <= 0) return;

    /*
      분노는 시간만으로 급격히 감소하지 않는다.
    */

    const angerRecovery = Math.min(
        elapsed * 0.12,
        0.5
    );

    emotions.anger = Math.max(
        0,
        emotions.anger - angerRecovery
    );

    /*
      다른 감정은 천천히 평온으로 돌아간다.
    */

    const decay = Math.min(
        elapsed * 0.08,
        0.4
    );

    for (const key of [
        "joy",
        "sadness",
        "disgust",
        "fear",
        "surprise"
    ]) {
        emotions[key] = Math.max(
            0,
            emotions[key] - decay
        );
    }

    emotions.calm = Math.max(
        emotions.calm,
        100 - (
            emotions.anger * 0.85 +
            emotions.joy * 0.35 +
            emotions.sadness * 0.50 +
            emotions.disgust * 0.65 +
            emotions.fear * 0.45 +
            emotions.surprise * 0.35
        )
    );

    normalizeEmotions();
}


/* =========================================================
   10. AI에게 전달할 감정 상태

function getEmotionContext() {

    return {

            sadness: round(emotions.sadness),

        consecutiveInsults: round(consecutiveInsults),

        angerResistance: round(angerResistance),

    };
}

/* =========================================================
   12. AI 응답 JSON 파싱
========================================================= */

function parseAIResponse(raw) {

    if (typeof raw !== "string") {
        raw = String(raw ?? "");
    }

    let cleaned = raw.trim();

    cleaned = cleaned
        .replace(/^```json\s*/i, "")
        .replace(/^```\s*/i, "")
        .replace(/\s*```$/, "");

    try {
        const parsed = JSON.parse(cleaned);

        return {
            reply: String(parsed.reply || "").trim(),
            emotion_note: String(parsed.emotion_note || "").trim(),
            response_mode: String(parsed.response_mode || "normal")
        };

    } catch (error) {

        /*
          JSON 파싱 실패 시 일반 텍스트로 처리
        */

        return {
            reply: cleaned,
            emotion_note: "",
            response_mode: "normal"
        };
    }
}


/* =========================================================
   13. AI 응답 생성
========================================================= */

async function generateAIReply(userMessage, analysis) {

    const prompt = buildPrompt(
        userMessage,
        analysis
    );

    try {

        const response = await puter.ai.chat(prompt);

        let raw = "";

        if (typeof response === "string") {
            raw = response;

        } else if (
            response &&
            typeof response.message?.content === "string"
        ) {
            raw = response.message.content;

        } else if (
            response &&
            typeof response.content === "string"
        ) {
            raw = response.content;

        } else {
            raw = JSON.stringify(response);
        }

        return parseAIResponse(raw);

    } catch (error) {

        console.error("AI 응답 생성 오류:", error);

        return {
            reply: "AI 응답을 생성하는 중 오류가 발생했어. 잠시 후 다시 시도해 줘.",
            emotion_note: "응답 생성 오류",
            response_mode: "normal"
        };
    }
}


/* =========================================================
   14. 답변 모드 검증
========================================================= */

function determineResponseMode() {

    const anger = emotions.anger;

    if (anger >= 95) return "extreme";
    if (anger >= 80) return "furious";
    if (anger >= 60) return "angry";
    if (anger >= 40) return "irritated";

    return "normal";
}


/* =========================================================
   15. AI 답변과 감정 상태 연결
========================================================= */

function applyEmotionToResponse(response) {

    const mode = determineResponseMode();

    /*
      감정 상태가 AI 응답의 어조와 일치하도록
      응답 모드를 최종적으로 보정한다.
    */

    response.response_mode = mode;

    return response;
}

function addToHistory(role, content) {

/* =========================================================
   19. 감정에 따른 아바타 표정
========================================================= */

const canvas = $("avatarCanvas");

const ctx = canvas.getContext("2d");

function resizeCanvas() {

    const rect = canvas.getBoundingClientRect();

    const dpr = window.devicePixelRatio || 1;

    canvas.width = Math.round(rect.width * dpr);

    canvas.height = Math.round(rect.height * dpr);

    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

function drawAvatar() {

    const rect = canvas.getBoundingClientRect();

    const w = rect.width;
    const h = rect.height;

    ctx.clearRect(0, 0, w, h);

    const dominant = getDominantEmotion();

    const anger = emotions.anger;
    const joy = emotions.joy;
    const sadness = emotions.sadness;
    const disgust = emotions.disgust;
    const fear = emotions.fear;
    const surprise = emotions.surprise;

    const cx = w / 2;
    const cy = h / 2 + 3;

    const faceRadius = Math.min(w * 0.27, h * 0.34);

    /*
      감정에 따른 얼굴 배경
    */

    let faceColor = "#e8c9a5";

    if (dominant === "anger") faceColor = "#e8a69b";
    if (dominant === "joy") faceColor = "#f3d4a1";
    if (dominant === "sadness") faceColor = "#b7c9e7";
    if (dominant === "disgust") faceColor = "#c7d2a5";
    if (dominant === "fear") faceColor = "#c3d8d8";
    if (dominant === "surprise") faceColor = "#f0d6b5";

    /*
      얼굴 그림자
    */

    ctx.save();

    ctx.shadowColor = "rgba(0,0,0,.25)";
    ctx.shadowBlur = 28;
    ctx.shadowOffsetY = 12;

    ctx.beginPath();

    ctx.ellipse(
        cx,
        cy,
        faceRadius,
        faceRadius * 1.15,
        0,
        0,
        Math.PI * 2
    );

    ctx.fillStyle = faceColor;

    ctx.fill();

    ctx.restore();

    /*
      머리카락
    */

    ctx.beginPath();

    ctx.ellipse(
        cx,
        cy - faceRadius * .42,
        faceRadius * 1.03,
        faceRadius * .72,
        0,
        Math.PI,
        Math.PI * 2
    );

    ctx.fillStyle = "#263249";

    ctx.fill();

    /*
      눈 위치
    */

    const eyeY = cy - faceRadius * .05;

    const eyeGap = faceRadius * .42;

    const leftEyeX = cx - eyeGap;

    const rightEyeX = cx + eyeGap;

    /*
      눈썹
    */

    ctx.lineWidth = 5;

    ctx.lineCap = "round";

    ctx.strokeStyle = "#44372f";

    const angerRatio = anger / 100;

    const browLift = joy > 50 ? -5 : 0;

    ctx.beginPath();

    ctx.moveTo(
        leftEyeX - 13,
        eyeY - 23 + browLift
    );

    ctx.lineTo(
        leftEyeX + 12,
        eyeY - 18 + browLift - angerRatio * 13
    );

    ctx.stroke();

    ctx.beginPath();

    ctx.moveTo(
        rightEyeX - 12,
        eyeY - 18 + browLift - angerRatio * 13
    );

    ctx.lineTo(
        rightEyeX + 13,
        eyeY - 23 + browLift
    );

    ctx.stroke();

    /*
      눈
    */

    const eyeRadius = 7 + surprise / 25;

    ctx.fillStyle = "#263249";

    ctx.beginPath();

    ctx.ellipse(
        leftEyeX,
        eyeY,
        eyeRadius,
        eyeRadius * (fear > 40 ? 1.3 : 1),
        0,
        0,
        Math.PI * 2
    );

    ctx.fill();

    ctx.beginPath();

    ctx.ellipse(
        rightEyeX,
        eyeY,
        eyeRadius,
        eyeRadius * (fear > 40 ? 1.3 : 1),
        0,
        0,
        Math.PI * 2
    );

    ctx.fill();

    /*
      입 모양
    */

    const mouthY = cy + faceRadius * .48;

    ctx.strokeStyle = "#70483e";

    ctx.lineWidth = 4;

    ctx.lineCap = "round";

    ctx.beginPath();

    if (anger >= 60 || disgust >= 60) {

        /*
          화난 표정
        */

        ctx.moveTo(
            cx - faceRadius * .30,
            mouthY + 8
        );

        ctx.lineTo(
            cx,
            mouthY - 2
        );

        ctx.lineTo(
            cx + faceRadius * .30,
            mouthY + 8
        );

    } else if (joy >= 35) {

        /*
          웃는 표정
        */

        ctx.arc(
            cx,
            mouthY - 8,
            faceRadius * .32,
            0.15,
            Math.PI - 0.15
        );

    } else if (sadness >= 40) {

        /*
          슬픈 표정
        */

        ctx.arc(
            cx,
            mouthY + 12,
            faceRadius * .30,
            Math.PI + 0.2,
            Math.PI * 2 - 0.2
        );

    } else if (surprise >= 50) {

        /*
          놀란 표정
        */

        ctx.beginPath();

        ctx.ellipse(
            cx,
            mouthY,
            faceRadius * .10,
            faceRadius * .16,
            0,
            0,
            Math.PI * 2
        );

    } else {

        /*
          평온한 표정
        */

        ctx.moveTo(
            cx - faceRadius * .25,
            mouthY
        );

        ctx.lineTo(
            cx + faceRadius * .25,
            mouthY
        );
    }

    ctx.stroke();

    /*
      감정 상태에 따른 얼굴 효과
    */

    if (anger >= 80) {

        ctx.fillStyle = "rgba(255,60,60,.12)";

        ctx.beginPath();

        ctx.ellipse(
            cx,
            cy,
            faceRadius * 1.08,
            faceRadius * 1.20,
            0,
            0,
            Math.PI * 2
        );

        ctx.fill();
    }
}

async function sendMessage() {

    const message = userInput.value.trim();

    isGenerating = true;

    sendBtn.disabled = true;

    userInput.disabled = true;

    /*
      사용자 메시지 출력
    */

    addMessage("user", message);

    addToHistory("user", message);

    /*
      감정 계산
    */

    const previousAnger = emotions.anger;

    const analysis = updateEmotionFromMessage(message);

    conversationTurn++;

    lastUserMessage = message;

    renderEmotionUI();

    /*
      AI 생성 상태 표시
    */

    typingIndicator.style.display = "block";

    statusDot.style.background = "#ffd166";

    statusText.textContent = "AI 응답 생성 중";

    try {

        /*
          AI 응답 생성
        */

        let response = await generateAIReply(
            message,
            analysis
        );

        /*
          감정 상태와 답변 모드 연결
        */

        response = applyEmotionToResponse(response);

        /*
          답변 출력
        */

        const reply = response.reply ||
            "지금은 답변을 생성하지 못했어.";

        addMessage("ai", reply);

        addToHistory("assistant", reply);

        lastAssistantReply = reply;

        /*
          AI가 반환한 감정 설명을 화면에 반영
        */

        if (response.emotion_note) {
            emotionNote.textContent =
                `${response.emotion_note} · ` +
                `분노 ${round(emotions.anger)}%`;
        }

        /*
          최종 감정 상태 유지
        */

        if (analysis.insult > 0) {
            preserveAnger(
                previousAnger,
                emotions.anger
            );
        }

        renderEmotionUI();

    } catch (error) {

        console.error(error);

        addMessage(
            "ai",
            "오류가 발생했어. 다시 시도해 줘."
        );

    } finally {

        isGenerating = false;

        sendBtn.disabled = false;

        userInput.disabled = false;

        typingIndicator.style.display = "none";

        statusDot.style.background = "#55d69e";

        statusText.textContent = "대화 준비 완료";

        userInput.value = "";

        userInput.style.height = "auto";

        userInput.focus();

        chatMessages.scrollTop = chatMessages.scrollHeight;
    }
}


/* =========================================================
   22. 감정 초기화
========================================================= */

function resetEmotion() {

    const confirmed = confirm(
        "감정 수치와 대화 기록을 초기화할까요?"
    );

    if (!confirmed) return;

    emotions = { ...DEFAULT_EMOTIONS };

    chatHistory = [];

    conversationTurn = 0;

    consecutiveInsults = 0;

    recentOffenses = [];

    angerResistance = 0;

    lastAngerEvent = 0;

    lastUserMessage = "";

    lastAssistantReply = "";

    lastEmotionUpdate = Date.now();

    chatMessages.innerHTML = "";

    addMessage(
        "ai",
        "안녕. 오늘은 어떤 이야기를 하고 싶어?"
    );

    renderEmotionUI();
}


/* =========================================================
   23. 이벤트 등록
========================================================= */

sendBtn.addEventListener(
    "click",
    sendMessage
);

userInput.addEventListener(
    "keydown",
    event => {

        if (
            event.key === "Enter" &&
            !event.shiftKey
        ) {
            event.preventDefault();

            sendMessage();
        }
    }
);

userInput.addEventListener(
    "input",
    () => {

        userInput.style.height = "auto";

        userInput.style.height =
            Math.min(
                userInput.scrollHeight,
                150
            ) + "px";
    }
);

$("resetBtn").addEventListener(
    "click",
    resetEmotion
);

window.addEventListener(
    "resize",
    resizeCanvas
);


/* =========================================================
   24. 초기 실행
========================================================= */

function init() {

    resizeCanvas();

    renderEmotionUI();

    animateAvatar();

    lastEmotionUpdate = Date.now();
}

init();

</script>

</body>
</html>
