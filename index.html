<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Natural Emotion Intensity Avatar</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Puter.js SDK -->
  <script src="https://js.puter.com/v2/"></script>
  <style>
    body {
      touch-action: manipulation;
      transition: background 1.0s ease-in-out;
    }
  </style>
</head>
<body id="bgBody" class="bg-slate-950 text-white min-h-[100dvh] flex flex-col items-center justify-center p-4">

  <div class="w-full max-w-xs flex flex-col items-center gap-4 my-auto">
    <!-- 2D 아바타 캔버스 -->
    <div class="relative">
      <canvas id="faceCanvas" width="220" height="220" class="rounded-3xl bg-slate-900/90 border border-white/10 shadow-2xl backdrop-blur-sm transition-all duration-500"></canvas>
      <div id="loading" class="hidden absolute -bottom-5 left-0 right-0 text-center text-[11px] text-sky-400 animate-pulse font-semibold">AI가 생각 중...</div>
    </div>

    <!-- AI 대답 말풍선 -->
    <div id="aiReplyBox" class="w-full bg-slate-900/80 border border-white/10 rounded-2xl p-3.5 min-h-[70px] flex flex-col justify-center transition-all duration-500 shadow-lg relative">
      <div class="text-[10px] text-sky-400 font-semibold mb-1 flex items-center gap-1">
        <span>🤖 AI 아바타의 대답</span>
      </div>
      <p id="aiReplyText" class="text-xs text-slate-200 leading-relaxed break-keep pr-8">
        메시지를 입력해 보세요.
      </p>
      <!-- 메모리 및 입력창 삭제 버튼 -->
      <button id="deleteMemoryBtn" class="absolute bottom-2 right-2 p-1.5 rounded-full bg-slate-800/80 hover:bg-red-950/80 text-slate-400 hover:text-red-400 transition-colors shadow-inner" title="대화 및 입력 내용 초기화">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-4 h-4">
          <path stroke-linecap="round" stroke-linejoin="round" d="M14.74 9l-.346 9m-4.788 0L9.26 9m9.968-3.21c.342.052.682.107 1.022.166m-1.022-.165L18.16 19.673a2.25 2.25 0 01-2.244 2.077H8.084a2.25 2.25 0 01-2.244-2.077L4.772 5.79m14.456 0a48.108 48.108 0 00-3.478-.397m-12 .562c.34-.059.68-.114 1.022-.165m0 0a48.11 48.11 0 013.478-.397m7.5 0v-.916c0-1.18-.91-2.164-2.09-2.201a51.964 51.964 0 00-3.32 0c-1.18.037-2.09 1.022-2.09 2.201v.916m7.5 0a48.667 48.667 0 00-7.5 0" />
        </svg>
      </button>
    </div>

    <!-- 텍스트 입력창 -->
    <div class="w-full space-y-2">
      <textarea id="textInput" placeholder="메시지를 입력해보세요..." rows="3" class="w-full bg-slate-900/80 border border-white/10 rounded-2xl p-3 text-xs text-white placeholder-slate-500 focus:outline-none focus:border-sky-500 resize-none shadow-inner transition-colors duration-300"></textarea>
      
      <!-- 에러 출력창 -->
      <div id="errorBox" class="hidden text-[11px] text-red-400 bg-red-950/50 border border-red-800/50 rounded-xl p-2.5 break-all"></div>
    </div>

    <!-- 감정 수치 HUD -->
    <div class="w-full bg-slate-900/60 border border-white/10 rounded-2xl p-3 space-y-2 backdrop-blur-sm transition-all duration-500" id="gaugeBox">
    </div>
  </div>

  <script>
    const canvas = document.getElementById('faceCanvas');
    const ctx = canvas.getContext('2d');
    const bgBody = document.getElementById('bgBody');
    const deleteMemoryBtn = document.getElementById('deleteMemoryBtn');
    const aiReplyText = document.getElementById('aiReplyText');
    const textInput = document.getElementById('textInput');
    
    // 기본 감정 데이터
    const defaultEmotions = { happy: 0, sad: 0, angry: 0, surprised: 0, fear: 0, disgust: 0, neutral: 1 };
    let targetEmotions = { ...defaultEmotions };
    let currentEmotions = { ...targetEmotions };

    // 대화 기록 저장 배열 (Memory)
    let chatHistory = [];

    // 감정별 피부 색상
    const emotionSkinColors = {
      happy: { r: 255, g: 218, b: 120 },
      sad: { r: 180, g: 200, b: 220 },
      angry: { r: 245, g: 90, b: 80 },
      surprised: { r: 255, g: 230, b: 140 },
      fear: { r: 160, g: 170, b: 200 },
      disgust: { r: 190, g: 205, b: 130 },
      neutral: { r: 250, g: 204, b: 21 }
    };

    // 감정별 배경 색상
    const emotionBgColors = {
      happy: { c1: { r: 55, g: 25, b: 20 }, c2: { r: 74, g: 44, b: 26 } },
      sad: { c1: { r: 10, g: 24, b: 42 }, c2: { r: 5, g: 16, b: 32 } },
      angry: { c1: { r: 48, g: 10, b: 12 }, c2: { r: 30, g: 5, b: 5 } },
      surprised: { c1: { r: 40, g: 18, b: 48 }, c2: { r: 20, g: 10, b: 30 } },
      fear: { c1: { r: 8, g: 32, b: 28 }, c2: { r: 3, g: 16, b: 16 } },
      disgust: { c1: { r: 24, g: 28, b: 10 }, c2: { r: 16, g: 20, b: 5 } },
      neutral: { c1: { r: 2, g: 6, b: 23 }, c2: { r: 1, g: 3, b: 15 } }
    };

    let particles = [];
    let frameCount = 0;

    function renderGauges() {
      const box = document.getElementById('gaugeBox');
      box.innerHTML = Object.keys(targetEmotions).map(key => `
        <div class="space-y-0.5">
          <div class="flex justify-between text-[11px] text-slate-300 capitalize">
            <span>${key}</span>
            <span id="val-${key}" class="text-sky-400">0%</span>
          </div>
          <div class="w-full bg-slate-800 h-1.5 rounded-full overflow-hidden">
            <div id="bar-${key}" class="bg-sky-500 h-full transition-all duration-300" style="width: 0%"></div>
          </div>
        </div>
      `).join('');
    }
    renderGauges();

    function draw() {
      frameCount++;
      const lerp = (a, b) => a + (b - a) * 0.12;

      for (let k in targetEmotions) {
        currentEmotions[k] = lerp(currentEmotions[k], targetEmotions[k]);
        const percent = Math.round(currentEmotions[k] * 100);
        if (document.getElementById(`val-${k}`)) {
          document.getElementById(`val-${k}`).innerText = percent + '%';
          document.getElementById(`bar-${k}`).style.width = percent + '%';
        }
      }

      const e = currentEmotions;
      const width = canvas.width, height = canvas.height;
      let cx = width / 2;
      let cy = height / 2;

      let bgC1_R = 0, bgC1_G = 0, bgC1_B = 0;
      let bgC2_R = 0, bgC2_G = 0, bgC2_B = 0;
      for (let k in e) {
        bgC1_R += emotionBgColors[k].c1.r * e[k];
        bgC1_G += emotionBgColors[k].c1.g * e[k];
        bgC1_B += emotionBgColors[k].c1.b * e[k];
        bgC2_R += emotionBgColors[k].c2.r * e[k];
        bgC2_G += emotionBgColors[k].c2.g * e[k];
        bgC2_B += emotionBgColors[k].c2.b * e[k];
      }
      bgBody.style.background = `linear-gradient(to bottom, rgb(${Math.round(bgC1_R)}, ${Math.round(bgC1_G)}, ${Math.round(bgC1_B)}), rgb(${Math.round(bgC2_R)}, ${Math.round(bgC2_G)}, ${Math.round(bgC2_B)}))`;

      let skinR = 0, skinG = 0, skinB = 0;
      for (let k in e) {
        skinR += emotionSkinColors[k].r * e[k];
        skinG += emotionSkinColors[k].g * e[k];
        skinB += emotionSkinColors[k].b * e[k];
      }

      let dominant = 'neutral';
      let maxVal = 0;
      for (let k in e) {
        if (e[k] > maxVal) {
          maxVal = e[k];
          dominant = k;
        }
      }

      let shakeIntensity = 0;
      if (e.fear > 0.25) shakeIntensity = Math.min(e.fear * 6, 5);
      if (e.angry > 0.65) shakeIntensity = Math.min((e.angry - 0.5) * 5, 4);
      
      if (shakeIntensity > 0) {
        cx += (Math.random() - 0.5) * shakeIntensity;
        cy += (Math.random() - 0.5) * shakeIntensity;
      }

      ctx.clearRect(0, 0, width, height);

      const maxParticleCap = 35;
      if (particles.length < maxParticleCap) {
        if (e.happy > 0.25) {
          const happyInterval = Math.max(3, Math.floor(20 - e.happy * 15));
          if (frameCount % happyInterval === 0) {
            particles.push({ type: 'heart', x: cx + (Math.random() - 0.5) * 110, y: cy + 40, size: 8 + e.happy * 12, vy: -1 - e.happy * 1.5, alpha: 1 });
          }
        }
        if (e.sad > 0.25) {
          const sadInterval = Math.max(2, Math.floor(14 - e.sad * 11));
          if (frameCount % sadInterval === 0) {
            particles.push({ type: 'rain', x: cx + (Math.random() - 0.5) * 130, y: cy - 65, vy: 3 + e.sad * 5, length: 6 + e.sad * 10, alpha: 0.8 });
          }
        }
        if (e.angry > 0.25) {
          const angryInterval = Math.max(1, Math.floor(12 - e.angry * 10));
          if (frameCount % angryInterval === 0) {
            particles.push({ type: 'fire', x: cx + (Math.random() - 0.5) * (80 + e.angry * 50), y: cy + 50, size: 4 + e.angry * 10, vy: -1.5 - e.angry * 2.5, vx: (Math.random() - 0.5) * (1 + e.angry * 2), alpha: 1 });
          }
        }
      }

      for (let i = particles.length - 1; i >= 0; i--) {
        let p = particles[i];
        if (p.type === 'heart') {
          p.y += p.vy; p.alpha -= 0.015;
          ctx.fillStyle = `rgba(244, 114, 182, ${Math.max(0, p.alpha)})`;
          ctx.font = `${p.size}px sans-serif`;
          ctx.fillText('♥', p.x, p.y);
        } else if (p.type === 'rain') {
          p.y += p.vy; p.alpha -= 0.025;
          ctx.strokeStyle = `rgba(56, 189, 248, ${Math.max(0, p.alpha)})`;
          ctx.lineWidth = 1.5 + e.sad * 2;
          ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p.x, p.y + p.length); ctx.stroke();
        } else if (p.type === 'fire') {
          p.y += p.vy; p.x += p.vx; p.alpha -= 0.035;
          ctx.fillStyle = `rgba(239, ${Math.floor(68 * (1 - e.angry * 0.5))}, 68, ${Math.max(0, p.alpha)})`;
          ctx.beginPath(); ctx.arc(p.x, p.y, Math.max(1, p.size * p.alpha), 0, Math.PI * 2); ctx.fill();
        }
        if (p.alpha <= 0 || p.y < 0 || p.y > height) particles.splice(i, 1);
      }

      ctx.beginPath();
      ctx.arc(cx, cy, 75, 0, Math.PI * 2);
      ctx.fillStyle = `rgb(${Math.round(skinR)}, ${Math.round(skinG)}, ${Math.round(skinB)})`;
      ctx.fill();

      if (e.fear > 0.2) {
        ctx.save();
        ctx.beginPath(); ctx.arc(cx, cy, 75, 0, Math.PI * 2); ctx.clip();
        ctx.fillStyle = `rgba(30, 58, 138, ${Math.min(0.7, e.fear * 0.75)})`;
        ctx.fillRect(cx - 75, cy - 75, 150, 40 + e.fear * 35);
        ctx.restore();
      }

      if (e.happy > 0.15) {
        const blushR = 10 + e.happy * 8;
        ctx.fillStyle = `rgba(244, 63, 94, ${Math.min(0.85, e.happy * 0.85)})`;
        ctx.beginPath(); ctx.arc(cx - 42, cy + 10, blushR, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.arc(cx + 42, cy + 10, blushR, 0, Math.PI * 2); ctx.fill();
      }

      ctx.lineWidth = 4;
      ctx.strokeStyle = '#0f172a';

      const drawEye = (isLeft) => {
        const eyeCx = isLeft ? cx - 28 : cx + 28;
        if (e.happy > 0.6) {
          ctx.beginPath();
          ctx.arc(eyeCx, cy - 8, 10 + e.happy * 2, Math.PI * 1.1, Math.PI * 1.9);
          ctx.stroke();
        } else {
          const eyeR = Math.min(18, Math.max(2, 7 + (e.surprised * 9) - (e.disgust * 3) - (e.angry * 2)));
          ctx.beginPath();
          ctx.arc(eyeCx, cy - 14, eyeR, 0, Math.PI * 2);
          ctx.fillStyle = (e.angry > 0.35) ? `rgb(${Math.floor(180 + e.angry * 75)}, 20, 20)` : '#0f172a';
          ctx.fill();
        }
      };
      drawEye(true);
      drawEye(false);

      ctx.lineWidth = 4 + (e.angry * 3);
      ctx.lineCap = 'round';
      ctx.strokeStyle = '#0f172a';

      const rawEyOffY = (e.sad * 10) - (e.angry * 10) - (e.surprised * 12);
      const eyOffY = Math.max(-16, Math.min(12, rawEyOffY));
      const rawTilt = (e.angry * 0.55) - (e.sad * 0.45);
      const eyTilt = Math.max(-0.5, Math.min(0.55, rawTilt));

      ctx.beginPath();
      ctx.moveTo(cx - 48, cy - 35 + eyOffY - eyTilt * 18);
      ctx.lineTo(cx - 10, cy - 35 + eyOffY + eyTilt * 18);
      ctx.stroke();

      ctx.beginPath();
      ctx.moveTo(cx + 10, cy - 35 + eyOffY + eyTilt * 18);
      ctx.lineTo(cx + 48, cy - 35 + eyOffY - eyTilt * 18);
      ctx.stroke();

      ctx.beginPath();
      if (dominant === 'surprised' && e.surprised > 0.35) {
        const mouthR = Math.min(24, 6 + e.surprised * 18);
        ctx.arc(cx, cy + 28, mouthR, 0, Math.PI * 2);
        ctx.fillStyle = '#0f172a';
        ctx.fill();
      } else if (dominant === 'fear' && e.fear > 0.35) {
        ctx.moveTo(cx - 24, cy + 28);
        ctx.quadraticCurveTo(cx - 12, cy + 22 - e.fear * 6, cx, cy + 28);
        ctx.quadraticCurveTo(cx + 12, cy + 34 + e.fear * 6, cx + 24, cy + 28);
        ctx.stroke();
      } else if (dominant === 'angry' && e.angry > 0.7) {
        ctx.fillStyle = '#0f172a';
        ctx.fillRect(cx - 26, cy + 20, 52, 16);
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(cx - 22, cy + 22, 44, 5);
        ctx.fillRect(cx - 22, cy + 29, 44, 5);
      } else {
        const rawCurve = (e.happy * 32) - (e.sad * 30) - (e.angry * 22);
        const mouthCurve = Math.max(-30, Math.min(32, rawCurve));
        ctx.moveTo(cx - 28, cy + 26);
        ctx.quadraticCurveTo(cx, cy + 26 + mouthCurve, cx + 28, cy + 26);
        ctx.stroke();
      }

      if (dominant === 'sad' && e.sad > 0.35) {
        ctx.fillStyle = `rgba(100, 116, 139, ${Math.min(0.9, e.sad * 0.95)})`;
        ctx.beginPath();
        ctx.arc(cx - 22, cy - 80, 14 + e.sad * 4, 0, Math.PI * 2);
        ctx.arc(cx, cy - 86, 18 + e.sad * 6, 0, Math.PI * 2);
        ctx.arc(cx + 22, cy - 80, 14 + e.sad * 4, 0, Math.PI * 2);
        ctx.fill();
      } else if (dominant === 'surprised' && e.surprised > 0.35) {
        const bounce = Math.sin(frameCount * 0.25) * (2 + e.surprised * 4);
        ctx.fillStyle = '#f59e0b';
        ctx.font = `bold ${Math.floor(20 + e.surprised * 12)}px sans-serif`;
        ctx.fillText('!', cx - 4, cy - 80 + bounce);
      }

      requestAnimationFrame(draw);
    }
    draw();

    let timer;
    const errorBox = document.getElementById('errorBox');
    
    function showError(msg) {
      errorBox.innerText = msg;
      errorBox.classList.remove('hidden');
    }
    function hideError() {
      errorBox.innerText = '';
      errorBox.classList.add('hidden');
    }

    // 메모리 및 입력창 내용 삭제 이벤트
    deleteMemoryBtn.addEventListener('click', () => {
      chatHistory = [];
      textInput.value = ""; 
      aiReplyText.innerText = "메시지를 입력해 보세요.";
      targetEmotions = { ...defaultEmotions };
    });

    textInput.addEventListener('input', (evt) => {
      clearTimeout(timer);
      hideError();

      const text = evt.target.value.trim();

      if (!text) {
        aiReplyText.innerText = chatHistory.length > 0 ? aiReplyText.innerText : "메시지를 입력해 보세요.";
        return;
      }

      timer = setTimeout(async () => {
        document.getElementById('loading').classList.remove('hidden');

        chatHistory.push({ role: 'user', content: text });

        try {
          let historyContext = "";
          if (chatHistory.length > 1) {
            historyContext = "\n\n[이전 대화 기록]\n" + 
              chatHistory.slice(0, -1).map(h => `${h.role === 'user' ? '사용자' : 'AI'}: ${h.content}`).join("\n");
          }

          const prompt = `당신은 사용자와 대화하는 AI 아바타입니다.
${historyContext}

사용자의 현재 입력: "${text}"

[대화 및 감정 판단 기준]
1. 일반적인 인사나 평범한 대화에서는 과도하게 놀라지 말고 neutral(평온)을 높게(0.6~0.9) 설정하세요.
2. 각 상황에 어울릴 때만 적절한 감정(happy, sad, angry, surprised, fear, disgust)을 반영하세요.
3. 이전 대화 맥락이 있다면 이를 기억하고 연결되는 자연스러운 답변을 하세요.
4. 자연스러운 친구 말투(반말)로 1~2문장의 답변을 작성하세요.

응답은 오직 아래 JSON 포맷으로만 반환하세요:
{
  "emotions": {
    "happy": 0.0,
    "sad": 0.0,
    "angry": 0.0,
    "surprised": 0.0,
    "fear": 0.0,
    "disgust": 0.0,
    "neutral": 1.0
  },
  "reply": "자연스러운 답변"
}`;

          const response = await puter.ai.chat(prompt);
          const responseText = response.toString().trim();

          const jsonMatch = responseText.match(/\{[\s\S]*\}/);
          if (!jsonMatch) {
            throw new Error("AI 응답 형식을 처리할 수 없습니다.");
          }

          const parsed = JSON.parse(jsonMatch[0]);
          
          if (parsed.emotions) {
            let rawEmotions = {
              happy: Math.max(0, Number(parsed.emotions.happy) || 0),
              sad: Math.max(0, Number(parsed.emotions.sad) || 0),
              angry: Math.max(0, Number(parsed.emotions.angry) || 0),
              surprised: Math.max(0, Number(parsed.emotions.surprised) || 0),
              fear: Math.max(0, Number(parsed.emotions.fear) || 0),
              disgust: Math.max(0, Number(parsed.emotions.disgust) || 0),
              neutral: Math.max(0, Number(parsed.emotions.neutral) || 0)
            };

            const totalSum = Object.values(rawEmotions).reduce((acc, val) => acc + val, 0);

            if (totalSum > 0) {
              targetEmotions = {
                happy: rawEmotions.happy / totalSum,
                sad: rawEmotions.sad / totalSum,
                angry: rawEmotions.angry / totalSum,
                surprised: rawEmotions.surprised / totalSum,
                fear: rawEmotions.fear / totalSum,
                disgust: rawEmotions.disgust / totalSum,
                neutral: rawEmotions.neutral / totalSum
              };
            } else {
              targetEmotions = { happy: 0, sad: 0, angry: 0, surprised: 0, fear: 0, disgust: 0, neutral: 1 };
            }
          }

          if (parsed.reply) {
            aiReplyText.innerText = parsed.reply;
            chatHistory.push({ role: 'assistant', content: parsed.reply });
          }

        } catch (err) {
          console.error(err);
          showError("AI 처리 오류: " + err.message);
        } finally {
          document.getElementById('loading').classList.add('hidden');
        }
      }, 700);
    });
  </script>
</body>
</html>
