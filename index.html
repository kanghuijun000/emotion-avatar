<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Natural Emotion Intensity Avatar</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://js.puter.com/v2/"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      touch-action: manipulation;
      transition: background 1s ease-in-out;
      min-height: 100dvh;
    }

    textarea {
      font-family: inherit;
    }

    button {
      -webkit-tap-highlight-color: transparent;
    }

    #faceCanvas {
      width: 220px;
      height: 220px;
      max-width: 100%;
    }

    .emotion-bar {
      transition: width 0.3s ease;
    }

    #sendBtn:disabled {
      opacity: 0.5;
      cursor: wait;
    }
  </style>
</head>

<body id="bgBody"
  class="bg-slate-950 text-white min-h-[100dvh] flex flex-col items-center justify-center p-4">

  <div class="w-full max-w-xs flex flex-col items-center gap-4 my-auto">

    <!-- 아바타 -->
    <div class="relative">
      <canvas
        id="faceCanvas"
        width="220"
        height="220"
        class="rounded-3xl bg-slate-900/90 border border-white/10 shadow-2xl">
      </canvas>

      <div id="loading"
        class="hidden absolute -bottom-5 left-0 right-0 text-center text-[11px] text-sky-400 animate-pulse font-semibold">
        AI가 생각 중...
      </div>
    </div>

    <!-- AI 답변 -->
    <div
      id="aiReplyBox"
      class="w-full bg-slate-900/80 border border-white/10 rounded-2xl p-3.5 min-h-[70px] flex flex-col justify-center shadow-lg relative">

      <div class="text-[10px] text-sky-400 font-semibold mb-1">
        🤖 AI 아바타의 대답
      </div>

      <p id="aiReplyText"
        class="text-xs text-slate-200 leading-relaxed break-keep pr-8">
        메시지를 입력해 보세요.
      </p>

      <button
        id="deleteMemoryBtn"
        class="absolute bottom-2 right-2 p-1.5 rounded-full bg-slate-800/80 hover:bg-red-950/80 text-slate-400 hover:text-red-400 transition-colors"
        title="대화 기록 전체 초기화">

        <svg xmlns="http://www.w3.org/2000/svg"
          fill="none" viewBox="0 0 24 24"
          stroke-width="2" stroke="currentColor"
          class="w-4 h-4">
          <path stroke-linecap="round" stroke-linejoin="round"
            d="M14.74 9l-.346 9m-4.788 0L9.26 9
            m9.968-3.21c.342.052.682.107 1.022.166
            m-1.022-.165L18.16 19.673a2.25 2.25 0 01-2.244 2.077H8.084
            a2.25 2.25 0 01-2.244-2.077L4.772 5.79
            m14.456 0a48.108 48.108 0 00-3.478-.397
            m-12 .562c.34-.059.68-.114 1.022-.165
            m0 0a48.11 48.11 0 013.478-.397
            m7.5 0v-.916c0-1.18-.91-2.164-2.09-2.201
            a51.964 51.964 0 00-3.32 0c-1.18.037-2.09 1.022-2.09 2.201v.916
            m7.5 0a48.667 48.667 0 00-7.5 0"/>
        </svg>
      </button>
    </div>

    <!-- 입력창 -->
    <div class="w-full space-y-2">
      <div class="relative w-full">

        <textarea
          id="textInput"
          placeholder="메시지를 입력해보세요..."
          rows="3"
          class="w-full bg-slate-900/80 border border-white/10 rounded-2xl p-3 pr-20 text-xs text-white placeholder-slate-500 focus:outline-none focus:border-sky-500 resize-none shadow-inner">
        </textarea>

        <div class="absolute bottom-3 right-3 flex items-center gap-1.5">

          <button
            id="clearInputBtn"
            class="p-1 rounded-full bg-slate-800/80 hover:bg-slate-700 text-slate-400 hover:text-white"
            title="입력 내용 지우기">

            <svg xmlns="http://www.w3.org/2000/svg"
              fill="none" viewBox="0 0 24 24"
              stroke-width="2.5" stroke="currentColor"
              class="w-3.5 h-3.5">
              <path stroke-linecap="round" stroke-linejoin="round"
                d="M6 18L18 6M6 6l12 12"/>
            </svg>
          </button>

          <button
            id="sendBtn"
            class="p-1.5 rounded-xl bg-sky-600 hover:bg-sky-500 text-white shadow"
            title="AI에게 전송">

            <svg xmlns="http://www.w3.org/2000/svg"
              fill="none" viewBox="0 0 24 24"
              stroke-width="2" stroke="currentColor"
              class="w-3.5 h-3.5">
              <path stroke-linecap="round" stroke-linejoin="round"
                d="M6 12L3.269 3.126A59.768 59.768 0 0121.485 12
                59.77 59.77 0 013.27 20.876L5.999 12zm0 0h7.5"/>
            </svg>
          </button>
        </div>
      </div>

      <div id="errorBox"
        class="hidden text-[11px] text-red-400 bg-red-950/50 border border-red-800/50 rounded-xl p-2.5 break-all">
      </div>
    </div>

    <!-- 감정 수치 -->
    <div
      id="gaugeBox"
      class="w-full bg-slate-900/60 border border-white/10 rounded-2xl p-3 space-y-2">
    </div>

  </div>

  <script>
    const canvas = document.getElementById("faceCanvas");
    const ctx = canvas.getContext("2d");

    const bgBody = document.getElementById("bgBody");
    const deleteMemoryBtn = document.getElementById("deleteMemoryBtn");
    const clearInputBtn = document.getElementById("clearInputBtn");
    const sendBtn = document.getElementById("sendBtn");
    const aiReplyText = document.getElementById("aiReplyText");
    const textInput = document.getElementById("textInput");
    const errorBox = document.getElementById("errorBox");
    const loading = document.getElementById("loading");

    const emotionNames = [
      "happy", "sad", "angry",
      "surprised", "fear", "disgust", "neutral"
    ];

    const emotionLabels = {
      happy: "기쁨",
      sad: "슬픔",
      angry: "분노",
      surprised: "놀람",
      fear: "두려움",
      disgust: "혐오",
      neutral: "중립"
    };

    const defaultEmotions = {
      happy: 0,
      sad: 0,
      angry: 0,
      surprised: 0,
      fear: 0,
      disgust: 0,
      neutral: 1
    };

    let targetEmotions = { ...defaultEmotions };
    let currentEmotions = { ...defaultEmotions };

    let chatHistory = [];
    let particles = [];
    let frameCount = 0;
    let isSending = false;

    // 분노 누적 상태
    let angerLevel = 0;

    // 연속적인 직접 모욕 횟수
    let consecutiveInsults = 0;

    // 극도의 분노 상태에서 대화 중단 여부
    let conversationBlocked = false;

    // 마지막으로 감정을 변경한 시각
    let lastEmotionUpdate = Date.now();

    // 감정 변화 설정
    const EMOTION_CONFIG = {
      anger: {
        insultIncrease: 0.18,
        repeatedInsultIncrease: 0.12,
        severeInsultIncrease: 0.30,
        apologyDecrease: 0.10,
        recoveryPerMinute: 0.015,
        highThreshold: 0.60,
        extremeThreshold: 0.85
      }
    };

    const emotionSkinColors = {
      happy:     { r: 255, g: 218, b: 120 },
      sad:       { r: 180, g: 200, b: 220 },
      angry:     { r: 245, g: 90, b: 80 },
      surprised: { r: 255, g: 230, b: 140 },
      fear:      { r: 160, g: 170, b: 200 },
      disgust:   { r: 190, g: 205, b: 130 },
      neutral:   { r: 250, g: 204, b: 21 }
    };

    const emotionBgColors = {
      happy: {
        c1: { r: 55, g: 25, b: 20 },
        c2: { r: 74, g: 44, b: 26 }
      },
      sad: {
        c1: { r: 10, g: 24, b: 42 },
        c2: { r: 5, g: 16, b: 32 }
      },
      angry: {
        c1: { r: 48, g: 10, b: 12 },
        c2: { r: 30, g: 5, b: 5 }
      },
      surprised: {
        c1: { r: 40, g: 18, b: 48 },
        c2: { r: 20, g: 10, b: 30 }
      },
      fear: {
        c1: { r: 8, g: 32, b: 28 },
        c2: { r: 3, g: 16, b: 16 }
      },
      disgust: {
        c1: { r: 24, g: 28, b: 10 },
        c2: { r: 16, g: 20, b: 5 }
      },
      neutral: {
        c1: { r: 2, g: 6, b: 23 },
        c2: { r: 1, g: 3, b: 15 }
      }
    };
    function renderGauges() {
      const box = document.getElementById("gaugeBox");

      box.innerHTML = emotionNames.map(key => `
        <div class="space-y-0.5">
          <div class="flex justify-between text-[11px] text-slate-300">
            <span>${emotionLabels[key]}</span>
            <span id="val-${key}" class="text-sky-400">0%</span>
          </div>

          <div class="w-full bg-slate-800 h-1.5 rounded-full overflow-hidden">
            <div id="bar-${key}"
              class="emotion-bar bg-sky-500 h-full"
              style="width:0%">
            </div>
          </div>
        </div>
      `).join("");
    }

    renderGauges();

    // 감정 수치 정규화
    function updateEmotionValues(emotions) {
      const clean = {};

      for (const key of emotionNames) {
        const value = Number(emotions?.[key]);

        clean[key] = Number.isFinite(value)
          ? Math.max(0, Math.min(1, value))
          : 0;
      }

      const sum = Object.values(clean).reduce((a, b) => a + b, 0);

      if (sum <= 0) {
        return { ...defaultEmotions };
      }

      for (const key of emotionNames) {
        clean[key] /= sum;
      }

      return clean;
    }

    // AI가 분석한 감정과 누적 분노를 결합
    function applyAngerToEmotions(emotions, anger) {
      const result = { ...emotions };

      const remaining = 1 - anger;
      const otherKeys = emotionNames.filter(key => key !== "angry");

      const otherSum = otherKeys.reduce(
        (sum, key) => sum + Math.max(0, result[key] || 0),
        0
      );

      result.angry = anger;

      for (const key of otherKeys) {
        result[key] = otherSum > 0
          ? Math.max(0, result[key] || 0) / otherSum * remaining
          : remaining / otherKeys.length;
      }

      return result;
    }

    // 감정 상태를 갱신
    function setEmotionState(emotions) {
      const normalized = updateEmotionValues(emotions);

      angerLevel = Math.max(
        0,
        Math.min(1, angerLevel)
      );

      targetEmotions = applyAngerToEmotions(
        normalized,
        Math.max(angerLevel, normalized.angry)
      );

      angerLevel = targetEmotions.angry;
    }

    // 감정 수치 표시 및 아바타 애니메이션
    function draw() {
      frameCount++;

      const lerp = (a, b) => a + (b - a) * 0.12;

      for (const key of emotionNames) {
        currentEmotions[key] = lerp(
          currentEmotions[key],
          targetEmotions[key]
        );

        const percent = Math.round(currentEmotions[key] * 100);
        const valueEl = document.getElementById(`val-${key}`);
        const barEl = document.getElementById(`bar-${key}`);

        if (valueEl) valueEl.textContent = percent + "%";
        if (barEl) barEl.style.width = percent + "%";
      }

      const e = currentEmotions;
      const width = canvas.width;
      const height = canvas.height;

      let cx = width / 2;
      let cy = height / 2;

      let bg1 = { r: 0, g: 0, b: 0 };
      let bg2 = { r: 0, g: 0, b: 0 };
      let skin = { r: 0, g: 0, b: 0 };

      for (const key of emotionNames) {
        const value = e[key];
        const bg = emotionBgColors[key];
        const sc = emotionSkinColors[key];

        bg1.r += bg.c1.r * value;
        bg1.g += bg.c1.g * value;
        bg1.b += bg.c1.b * value;

        bg2.r += bg.c2.r * value;
        bg2.g += bg.c2.g * value;
        bg2.b += bg.c2.b * value;

        skin.r += sc.r * value;
        skin.g += sc.g * value;
        skin.b += sc.b * value;
      }

      bgBody.style.background =
        `linear-gradient(to bottom,
        rgb(${Math.round(bg1.r)},${Math.round(bg1.g)},${Math.round(bg1.b)}),
        rgb(${Math.round(bg2.r)},${Math.round(bg2.g)},${Math.round(bg2.b)}))`;

      let dominant = "neutral";

      for (const key of emotionNames) {
        if (e[key] > e[dominant]) dominant = key;
      }

      let shake = 0;

      if (e.fear > 0.25) shake = Math.min(e.fear * 6, 5);
      if (e.angry > 0.65) shake = Math.min((e.angry - 0.5) * 5, 4);

      if (shake > 0) {
        cx += (Math.random() - 0.5) * shake;
        cy += (Math.random() - 0.5) * shake;
      }

      ctx.clearRect(0, 0, width, height);

      // 감정별 파티클 생성
      if (particles.length < 35) {
        if (e.happy > 0.25 && frameCount % 8 === 0) {
          particles.push({
            type: "heart",
            x: cx + (Math.random() - 0.5) * 110,
            y: cy + 40,
            size: 8 + e.happy * 12,
            vy: -1 - e.happy * 1.5,
            alpha: 1
          });
        }

        if (e.sad > 0.25 && frameCount % 6 === 0) {
          particles.push({
            type: "rain",
            x: cx + (Math.random() - 0.5) * 130,
            y: cy - 65,
            vy: 3 + e.sad * 5,
            length: 6 + e.sad * 10,
            alpha: 0.8
          });
        }

        if (e.angry > 0.25 && frameCount % 5 === 0) {
          particles.push({
            type: "fire",
            x: cx + (Math.random() - 0.5) * 100,
            y: cy + 50,
            size: 4 + e.angry * 10,
            vy: -1.5 - e.angry * 2.5,
            vx: (Math.random() - 0.5) * 3,
            alpha: 1
          });
        }
      }

      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];

        if (p.type === "heart") {
          p.y += p.vy;
          p.alpha -= 0.015;
          ctx.fillStyle = `rgba(244,114,182,${Math.max(0,p.alpha)})`;
          ctx.font = `${p.size}px sans-serif`;
          ctx.fillText("♥", p.x, p.y);
        }

        if (p.type === "rain") {
          p.y += p.vy;
          p.alpha -= 0.025;
          ctx.strokeStyle = `rgba(56,189,248,${Math.max(0,p.alpha)})`;
          ctx.lineWidth = 1.5 + e.sad * 2;
          ctx.beginPath();
          ctx.moveTo(p.x, p.y);
          ctx.lineTo(p.x, p.y + p.length);
          ctx.stroke();
        }

        if (p.type === "fire") {
          p.y += p.vy;
          p.x += p.vx;
          p.alpha -= 0.035;
          ctx.fillStyle =
            `rgba(239,${Math.floor(68 * (1 - e.angry * 0.5))},68,${Math.max(0,p.alpha)})`;
          ctx.beginPath();
          ctx.arc(p.x, p.y, Math.max(1, p.size * p.alpha), 0, Math.PI * 2);
          ctx.fill();
        }

        if (p.alpha <= 0 || p.y < 0 || p.y > height) {
          particles.splice(i, 1);
        }
      }

      // 얼굴
      ctx.beginPath();
      ctx.arc(cx, cy, 75, 0, Math.PI * 2);
      ctx.fillStyle =
        `rgb(${Math.round(skin.r)},${Math.round(skin.g)},${Math.round(skin.b)})`;
      ctx.fill();

      // 두려움 효과
      if (e.fear > 0.2) {
        ctx.save();
        ctx.beginPath();
        ctx.arc(cx, cy, 75, 0, Math.PI * 2);
        ctx.clip();
        ctx.fillStyle = `rgba(30,58,138,${Math.min(0.7,e.fear * 0.75)})`;
        ctx.fillRect(cx - 75, cy - 75, 150, 40 + e.fear * 35);
        ctx.restore();
      }

      // 홍조
      if (e.happy > 0.15) {
        const blush = 10 + e.happy * 8;
        ctx.fillStyle = `rgba(244,63,94,${Math.min(0.85,e.happy * 0.85)})`;

        ctx.beginPath();
        ctx.arc(cx - 42, cy + 10, blush, 0, Math.PI * 2);
        ctx.fill();

        ctx.beginPath();
        ctx.arc(cx + 42, cy + 10, blush, 0, Math.PI * 2);
        ctx.fill();
      }

      // 눈
      ctx.lineWidth = 4;
      ctx.strokeStyle = "#0f172a";

      function drawEye(isLeft) {
        const eyeCx = isLeft ? cx - 28 : cx + 28;

        if (e.happy > 0.6) {
          ctx.beginPath();
          ctx.arc(eyeCx, cy - 8, 10 + e.happy * 2, Math.PI * 1.1, Math.PI * 1.9);
          ctx.stroke();
        } else {
          const eyeR = Math.min(
            18,
            Math.max(2, 7 + e.surprised * 9 - e.disgust * 3 - e.angry * 2)
          );

          ctx.beginPath();
          ctx.arc(eyeCx, cy - 14, eyeR, 0, Math.PI * 2);

          ctx.fillStyle = e.angry > 0.35
            ? `rgb(${Math.floor(180 + e.angry * 75)},20,20)`
            : "#0f172a";

          ctx.fill();
        }
      }

      drawEye(true);
      drawEye(false);

      // 눈썹
      ctx.lineWidth = 4 + e.angry * 3;
      ctx.lineCap = "round";
      ctx.strokeStyle = "#0f172a";

      const browY = Math.max(
        -16,
        Math.min(12, e.sad * 10 - e.angry * 10 - e.surprised * 12)
      );

      const tilt = Math.max(
        -0.5,
        Math.min(0.55, e.angry * 0.55 - e.sad * 0.45)
      );

      ctx.beginPath();
      ctx.moveTo(cx - 48, cy - 35 + browY - tilt * 18);
      ctx.lineTo(cx - 10, cy - 35 + browY + tilt * 18);
      ctx.stroke();

      ctx.beginPath();
      ctx.moveTo(cx + 10, cy - 35 + browY + tilt * 18);
      ctx.lineTo(cx + 48, cy - 35 + browY - tilt * 18);
      ctx.stroke();

      // 입
      ctx.beginPath();

      if (dominant === "surprised" && e.surprised > 0.35) {
        const r = Math.min(24, 6 + e.surprised * 18);
        ctx.arc(cx, cy + 28, r, 0, Math.PI * 2);
        ctx.fillStyle = "#0f172a";
        ctx.fill();
      } else if (dominant === "fear" && e.fear > 0.35) {
        ctx.moveTo(cx - 24, cy + 28);
        ctx.quadraticCurveTo(cx - 12, cy + 22 - e.fear * 6, cx, cy + 28);
        ctx.quadraticCurveTo(cx + 12, cy + 34 + e.fear * 6, cx + 24, cy + 28);
        ctx.stroke();
      } else if (dominant === "angry" && e.angry > 0.7) {
        ctx.fillStyle = "#0f172a";
        ctx.fillRect(cx - 26, cy + 20, 52, 16);
        ctx.fillStyle = "#fff";
        ctx.fillRect(cx - 22, cy + 22, 44, 5);
        ctx.fillRect(cx - 22, cy + 29, 44, 5);
      } else {
        const curve = Math.max(
          -30,
          Math.min(32, e.happy * 32 - e.sad * 30 - e.angry * 22)
        );

        ctx.moveTo(cx - 28, cy + 26);
        ctx.quadraticCurveTo(cx, cy + 26 + curve, cx + 28, cy + 26);
        ctx.stroke();
      }

      // 감정 표시
      if (dominant === "sad" && e.sad > 0.35) {
        ctx.fillStyle = `rgba(100,116,139,${Math.min(0.9,e.sad * 0.95)})`;

        ctx.beginPath();
        ctx.arc(cx - 22, cy - 80, 14 + e.sad * 4, 0, Math.PI * 2);
        ctx.arc(cx, cy - 86, 18 + e.sad * 6, 0, Math.PI * 2);
        ctx.arc(cx + 22, cy - 80, 14 + e.sad * 4, 0, Math.PI * 2);
        ctx.fill();
      } else if (dominant === "surprised" && e.surprised > 0.35) {
        const bounce = Math.sin(frameCount * 0.25) * (2 + e.surprised * 4);
        ctx.fillStyle = "#f59e0b";
        ctx.font = `bold ${Math.floor(20 + e.surprised * 12)}px sans-serif`;
        ctx.fillText("!", cx - 4, cy - 80 + bounce);
      }

      requestAnimationFrame(draw);
    }

    draw();
    function showError(message) {
      errorBox.textContent = message;
      errorBox.classList.remove("hidden");
    }

    function hideError() {
      errorBox.textContent = "";
      errorBox.classList.add("hidden");
    }

    function getEmotionSummary(emotions) {
      return emotionNames
        .map(key => `${emotionLabels[key]} ${Math.round(emotions[key] * 100)}%`)
        .join(", ");
    }

    function extractResponseText(response) {
      if (typeof response === "string") return response;

      if (response?.message?.content) {
        const content = response.message.content;

        if (typeof content === "string") return content;

        if (Array.isArray(content)) {
          return content
            .map(item => item.text || "")
            .join("\n");
        }
      }

      if (response?.text) return response.text;

      return String(response ?? "");
    }

    function parseAIJson(rawText) {
      const cleaned = rawText
        .replace(/```json/gi, "")
        .replace(/```/g, "")
        .trim();

      const start = cleaned.indexOf("{");
      const end = cleaned.lastIndexOf("}");

      if (start === -1 || end === -1 || end <= start) {
        throw new Error("AI 응답에 JSON 데이터가 없습니다.");
      }

      return JSON.parse(cleaned.slice(start, end + 1));
    }

    /*
     * ---------------------------------------------------------
     * 감정 관련 보조 함수
     * ---------------------------------------------------------
     */

    function normalizeNumber(value, fallback = 0) {
      const number = Number(value);

      if (!Number.isFinite(number)) {
        return fallback;
      }

      return Math.max(0, Math.min(1, number));
    }

    function getEmotionTimeRecovery() {
      const now = Date.now();
      const elapsedMinutes =
        Math.max(0, now - lastEmotionUpdate) / 60000;

      lastEmotionUpdate = now;

      if (elapsedMinutes <= 0) {
        return;
      }

      /*
       * 시간이 지났다고 분노가 갑자기 0이 되지 않도록
       * 아주 천천히 자연스럽게 회복한다.
       */
      const recovery =
        elapsedMinutes *
        EMOTION_CONFIG.anger.recoveryPerMinute;

      if (angerLevel > 0) {
        angerLevel = Math.max(
          0,
          angerLevel - recovery
        );
      }
    }

    function detectUserIntent(text) {
      const lower = text.toLowerCase().trim();

      /*
       * 자기 자신을 향한 표현은
       * AI에 대한 모욕으로 취급하지 않는다.
       */
      const selfDirectedPatterns = [
        "내가 병신",
        "나는 병신",
        "내가 바보",
        "나는 바보",
        "내가 멍청",
        "나는 멍청",
        "내가 븅신",
        "나는 븅신",
        "내가 쓰레기",
        "나는 쓰레기"
      ];

      const isSelfDirected =
        selfDirectedPatterns.some(pattern =>
          lower.includes(pattern)
        );

      /*
       * 사과 / 화해
       */
      const apologyPatterns = [
        "미안",
        "미안해",
        "미안하다",
        "미안했어",
        "죄송",
        "잘못했",
        "사과할게",
        "사과해",
        "용서해",
        "화 풀어",
        "화해하자"
      ];

      const isApology =
        apologyPatterns.some(pattern =>
          lower.includes(pattern)
        );

      /*
       * 직접적인 모욕 표현.
       * 단순히 단어가 존재한다고 무조건 모욕으로 처리하지 않고
       * 문장의 방향성을 함께 확인한다.
       */
      const insultPatterns = [
        "병신",
        "븅신",
        "ㅂㅅ",
        "시발",
        "씨발",
        "ㅅㅂ",
        "개새끼",
        "개새",
        "좆같",
        "좆",
        "꺼져",
        "닥쳐",
        "찐따",
        "쓰레기",
        "멍청",
        "바보",
        "한심",
        "등신",
        "지랄",
        "염병"
      ];

      const hasInsultWord =
        insultPatterns.some(pattern =>
          lower.includes(pattern)
        );

      /*
       * AI를 직접 지칭하는 표현.
       */
      const directTargetPatterns = [
        "너 ",
        "너는",
        "네가",
        "니가",
        "니 ",
        "ai",
        "아바타",
        "챗gpt",
        "너한테",
        "너에게"
      ];

      const directlyTargetsAI =
        directTargetPatterns.some(pattern =>
          lower.includes(pattern)
        );

      /*
       * 명령형/공격형 표현은 직접적인 대상이 없어도
       * 문맥상 AI에게 하는 말일 가능성이 높다.
       */
      const aggressivePatterns = [
        "꺼져",
        "닥쳐",
        "죽어",
        "그만해",
        "하지마",
        "싫어",
        "좆같아",
        "개같아"
      ];

      const isAggressive =
        aggressivePatterns.some(pattern =>
          lower.includes(pattern)
        );

      /*
       * 질문이나 설명에 욕설이 포함된 경우에는
       * 무조건 분노시키지 않는다.
       */
      const explanatoryPatterns = [
        "무슨 뜻",
        "뜻이 뭐",
        "무슨 말",
        "욕이야",
        "욕설",
        "예시",
        "예를 들어",
        "말해봐",
        "설명해",
        "무엇",
        "뭐야"
      ];

      const isExplanatory =
        explanatoryPatterns.some(pattern =>
          lower.includes(pattern)
        );

      let directInsult = false;

      if (!isSelfDirected && !isExplanatory) {
        if (hasInsultWord && directlyTargetsAI) {
          directInsult = true;
        }

        if (hasInsultWord && isAggressive) {
          directInsult = true;
        }

        if (isAggressive && !isSelfDirected) {
          directInsult = true;
        }
      }

      /*
       * 강한 모욕은 별도로 판단한다.
       */
      const severePatterns = [
        "개새끼",
        "씨발놈",
        "씨발년",
        "좆같은 놈",
        "좆같은 새끼",
        "병신새끼",
        "븅신새끼",
        "죽어",
        "뒤져"
      ];

      const severeInsult =
        directInsult &&
        severePatterns.some(pattern =>
          lower.includes(pattern)
        );

      /*
       * 긍정적인 반응
       */
      const positivePatterns = [
        "고마워",
        "고맙다",
        "고맙네",
        "좋아",
        "잘했어",
        "최고",
        "대단해",
        "재밌다",
        "재밌어",
        "웃겨",
        "사랑해",
        "괜찮아",
        "잘한다"
      ];

      const isPositive =
        positivePatterns.some(pattern =>
          lower.includes(pattern)
        );

      return {
        isApology,
        directInsult,
        severeInsult,
        isSelfDirected,
        isExplanatory,
        isPositive
      };
    }

    /*
     * ---------------------------------------------------------
     * 분노 누적
     * ---------------------------------------------------------
     */

    function updateAngerFromUserMessage(text) {
      getEmotionTimeRecovery();

      const intent = detectUserIntent(text);

      /*
       * 사과는 분노를 낮추지만
       * 한 번의 사과로 완전히 초기화하지 않는다.
       */
      if (intent.isApology) {
        angerLevel = Math.max(
          0,
          angerLevel -
          EMOTION_CONFIG.anger.apologyDecrease
        );

        consecutiveInsults = 0;

        /*
         * 극도의 분노가 아니었다면
         * 대화 차단 상태도 해제할 수 있다.
         */
        if (angerLevel < 0.70) {
          conversationBlocked = false;
        }

        return {
          intent,
          angerChange: -EMOTION_CONFIG.anger.apologyDecrease
        };
      }

      /*
       * 직접적인 모욕이 아니면
       * 반복 모욕 횟수를 초기화한다.
       *
       * 중요한 점:
       * 평범한 문장을 보냈다고 해서
       * 이미 쌓인 분노를 리셋하지 않는다.
       */
      if (!intent.directInsult) {
        consecutiveInsults = 0;

        return {
          intent,
          angerChange: 0
        };
      }

      /*
       * 직접적인 모욕이면 누적한다.
       */
      consecutiveInsults++;

      let increase =
        EMOTION_CONFIG.anger.insultIncrease;

      /*
       * 같은 대화에서 반복적으로 모욕하면
       * 분노가 줄어드는 것이 아니라 추가로 누적된다.
       */
      if (consecutiveInsults > 1) {
        increase +=
          Math.min(
            (consecutiveInsults - 1) *
            EMOTION_CONFIG.anger.repeatedInsultIncrease,
            0.30
          );
      }

      /*
       * 심한 모욕은 더 큰 변화.
       */
      if (intent.severeInsult) {
        increase +=
          EMOTION_CONFIG.anger.severeInsultIncrease;
      }

      const before = angerLevel;

      angerLevel = Math.min(
        1,
        angerLevel + increase
      );

      /*
       * 극도의 분노 상태.
       */
      if (
        angerLevel >=
        EMOTION_CONFIG.anger.extremeThreshold
      ) {
        conversationBlocked = true;
      }

      return {
        intent,
        angerChange: angerLevel - before
      };
    }

    /*
     * ---------------------------------------------------------
     * AI 감정과 누적 분노를 결합
     * ---------------------------------------------------------
     */

    function mergeAIEmotionWithPersistentAnger(
      aiEmotions,
      userIntent
    ) {
      const ai = {};

      for (const key of emotionNames) {
        ai[key] = normalizeNumber(
          aiEmotions?.[key],
          0
        );
      }

      /*
       * AI가 판단한 분노도 반영한다.
       */
      const aiAnger = ai.angry;

      /*
       * 직접 모욕이면 누적 분노가 기준이 된다.
       */
      if (userIntent.directInsult) {
        angerLevel = Math.max(
          angerLevel,
          aiAnger
        );
      } else {
        /*
         * 모욕이 아닌 경우에는 AI의 분노가
         * 갑자기 기존 분노를 덮어쓰지 못하게 한다.
         */
        angerLevel = Math.max(
          0,
          angerLevel
        );
      }

      /*
       * 분노가 낮은 상황에서는 AI가 판단한 다른 감정을
       * 그대로 사용할 수 있다.
       */
      return applyAngerToEmotions(
        ai,
        angerLevel
      );
    }

    /*
     * ---------------------------------------------------------
     * 분노 단계별 AI 행동 지침
     * ---------------------------------------------------------
     */

    function getAngerBehaviorInstruction() {
      if (angerLevel >= 0.90) {
        return `
현재 분노 수치가 극도로 높다.
사용자에게 실제로 화가 난 상태처럼 반응해.
더 이상 평소처럼 친절하고 아무렇지 않은 말투를 사용하지 마.
대화를 계속하기 싫다는 의사를 분명하게 표현할 수 있다.
필요하다면 "그만해", "나 지금 정말 화났어", "이제 대화하기 싫어"와 같이 직접적으로 말해도 된다.
단, 사용자를 위협하거나 모욕하거나 해를 가하겠다고 말하지 마.
`;
      }

      if (angerLevel >= 0.75) {
        return `
현재 분노가 매우 높은 상태다.
답변에서 실제로 화가 난 감정을 분명하게 드러내.
평소의 친절한 말투를 유지하지 말고 단호하고 날카로운 말투를 사용해.
필요하면 "그만해", "계속 그러면 나도 화낼 수밖에 없어"처럼 강한 불쾌감을 표현할 수 있다.
사용자를 모욕하거나 위협하지는 마.
`;
      }

      if (angerLevel >= 0.55) {
        return `
현재 분노가 상당히 높은 상태다.
답변에서 불쾌함과 화가 난 감정을 명확하게 드러내.
너무 아무렇지 않게 친절한 답변을 하지 마.
`;
      }

      if (angerLevel >= 0.35) {
        return `
현재 약간 화가 난 상태다.
답변에 가벼운 불쾌감이나 서운함을 자연스럽게 드러낼 수 있다.
`;
      }

      return `
현재 분노가 낮은 상태다.
특별한 이유가 없다면 자연스럽고 편안하게 대화한다.
`;
    }

    /*
     * ---------------------------------------------------------
     * 기억 초기화
     * ---------------------------------------------------------
     */

    deleteMemoryBtn.addEventListener("click", () => {
      chatHistory = [];

      angerLevel = 0;
      consecutiveInsults = 0;
      conversationBlocked = false;
      lastEmotionUpdate = Date.now();

      targetEmotions = { ...defaultEmotions };

      aiReplyText.textContent =
        "메시지를 입력해 보세요.";

      hideError();
    });

    clearInputBtn.addEventListener("click", () => {
      textInput.value = "";
      textInput.focus();
      hideError();
    });

    /*
     * ---------------------------------------------------------
     * 메시지 전송
     * ---------------------------------------------------------
     */

    async function sendMessage() {
      const text = textInput.value.trim();

      if (!text || isSending) return;

      if (!window.puter || !puter.ai) {
        showError(
          "Puter.js를 불러오지 못했습니다. 페이지를 새로고침해 주세요."
        );
        return;
      }

      isSending = true;
      sendBtn.disabled = true;
      loading.classList.remove("hidden");
      hideError();

      textInput.value = "";

      /*
       * 현재 사용자 입력을 먼저 분석한다.
       */
      const angerResult =
        updateAngerFromUserMessage(text);

      const userIntent =
        angerResult.intent;

      /*
       * 극도의 분노 상태에서
       * 사용자가 계속 직접적인 모욕을 하는 경우
       * AI가 대화를 거부할 수 있도록 한다.
       *
       * 단, 사과 메시지는 허용한다.
       */
      if (
        conversationBlocked &&
        !userIntent.isApology &&
        userIntent.directInsult
      ) {
        const extremeReply =
          angerLevel >= 0.95
            ? "그만해. 나 지금 정말 화났어. 계속 이런 식으로 말하면 더 이상 대화하지 않을 거야."
            : "그만해 줘. 지금은 정말 화가 나 있어서 이런 식으로 대화하고 싶지 않아.";

        targetEmotions = applyAngerToEmotions(
          {
            happy: 0,
            sad: 0.02,
            angry: 1,
            surprised: 0,
            fear: 0,
            disgust: 0.05,
            neutral: 0
          },
          angerLevel
        );

        chatHistory.push(
          { role: "user", content: text },
          { role: "assistant", content: extremeReply }
        );

        if (chatHistory.length > 40) {
          chatHistory = chatHistory.slice(-40);
        }

        aiReplyText.textContent = extremeReply;

        isSending = false;
        sendBtn.disabled = false;
        loading.classList.add("hidden");

        return;
      }

      const previousEmotionSummary =
        getEmotionSummary(targetEmotions);

      const historyContext =
        chatHistory
          .slice(-16)
          .map(item => {
            return `${item.role === "user" ? "사용자" : "AI"}: ${item.content}`;
          })
          .join("\n");

      const angerInstruction =
        getAngerBehaviorInstruction();

      const prompt = `
너는 사용자와 자연스럽게 대화하는 AI 아바타야.

자연스럽고 위트 있는 반말로 대답해.
보통 1~2문장으로 답해.

[이전 대화]
${historyContext || "(이전 대화 없음)"}

[직전 감정 상태]
${previousEmotionSummary}

[현재 실제 누적 분노]
${Math.round(angerLevel * 100)}%

[현재 연속 직접 모욕 횟수]
${consecutiveInsults}

[현재 사용자 입력]
${JSON.stringify(text)}

[이번 입력 분석]
- AI를 직접 향한 모욕: ${userIntent.directInsult ? "예" : "아니오"}
- 심한 모욕: ${userIntent.severeInsult ? "예" : "아니오"}
- 사과/화해: ${userIntent.isApology ? "예" : "아니오"}
- 자기 자신에 대한 표현: ${userIntent.isSelfDirected ? "예" : "아니오"}
- 설명/질문 목적: ${userIntent.isExplanatory ? "예" : "아니오"}

[대화 해석 원칙]
1. 현재 입력의 목적과 대화 흐름을 먼저 파악해.
2. 이전 대화는 현재 입력과 관련이 있을 때만 참고해.
3. 사용자가 요청하지 않은 상황이나 주제를 임의로 만들지 마.
4. "나/내가"는 사용자를, "너/네가"는 AI를 가리키는 것으로 해석해.
5. "나를 재밌게 해봐"는 사용자를 즐겁게 해 달라는 뜻이야.
6. 실제로 할 수 없는 행동을 했다고 단정하지 마.
7. 욕설이 인용, 설명, 질문, 자기 자신을 향한 표현이라면 자동으로 화내지 마.
8. AI를 향한 직접적인 모욕에는 현재 누적 분노에 맞게 반응해.
9. 반복적인 모욕은 이전 분노를 고려해서 더 강하게 반응할 수 있다.
10. 가벼운 놀림이나 장난에는 상황에 맞게 유쾌하게 반응할 수 있다.
11. 사용자를 모욕하거나 위협하지 마.
12. 사과가 들어오면 즉시 모든 분노를 0으로 만들지 말고 현재 분노에서 자연스럽게 낮춰.
13. 평범한 메시지가 들어왔다고 해서 기존 분노를 자동으로 0으로 만들지 마.
14. 이전 분노가 높다면 답변에서도 그 감정이 어느 정도 이어져야 한다.
15. 현재 감정과 답변의 말투가 서로 모순되지 않게 해.

[현재 AI의 행동 지침]
${angerInstruction}

[감정 연속성]
감정은 happy, sad, angry, surprised, fear, disgust, neutral의 7가지다.

각 감정의 출력값은 0~1이다.
출력값의 합은 반드시 1이 되어야 한다.

중요:
- angry는 현재 누적 분노와 모순되지 않아야 한다.
- 사용자가 AI를 반복적으로 직접 모욕했다면 angry를 낮게 설정하지 마.
- 현재 누적 분노가 높다면 평범한 neutral 답변을 하지 마.
- 사과했다고 해서 angry를 갑자기 0으로 만들지 마.
- 자기 자신을 욕한 경우에는 AI가 공격받았다고 판단하지 마.
- 단어 하나만 보고 감정을 판단하지 말고 문맥을 고려해.
- 현재 메시지와 이전 대화를 함께 고려해.

[감정과 답변의 연결]
분노가 0~0.30이면 자연스럽고 편안한 말투.
분노가 0.31~0.55이면 약간 불쾌하거나 서운한 말투.
분노가 0.56~0.75이면 분명히 화가 난 말투.
분노가 0.76~0.89이면 강하게 화난 말투.
분노가 0.90 이상이면 극도로 화난 상태이며 대화를 거부할 수도 있다.

반드시 현재 분노 수치와 답변의 어조가 일치해야 한다.

[출력 규칙]
반드시 JSON 하나만 출력해.
JSON 바깥에 설명이나 마크다운을 쓰지 마.

{
  "emotions": {
    "happy": 0.0,
    "sad": 0.0,
    "angry": 0.0,
    "surprised": 0.0,
    "fear": 0.0,
    "disgust": 0.0,
    "neutral": 1.0
  },
  "reply": "자연스러운 답변"
}
`;

      try {
        const response =
          await puter.ai.chat(prompt);

        const responseText =
          extractResponseText(response);

        const parsed =
          parseAIJson(responseText);

        if (!parsed || typeof parsed !== "object") {
          throw new Error(
            "AI 응답 형식이 올바르지 않습니다."
          );
        }

        const reply =
          String(parsed.reply ?? "").trim();

        if (!reply) {
          throw new Error(
            "AI 답변이 비어 있습니다."
          );
        }

        /*
         * AI 감정과 지속되는 분노를 결합한다.
         *
         * 여기서 중요한 점은:
         *
         * 이전 코드처럼 AI가 이번 한 번의 답변에서
         * angry: 0.01을 반환했다고 해서
         * 이미 누적된 분노를 0.01로 덮어쓰지 않는다.
         */
        targetEmotions =
          mergeAIEmotionWithPersistentAnger(
            parsed.emotions,
            userIntent
          );

        /*
         * 직접적인 모욕이 아니라면
         * 연속 모욕 카운터는 이미 앞에서 0으로 처리된다.
         *
         * 따라서 일반적인 대화가 들어왔다고 해서
         * 누적 분노 자체는 초기화되지 않는다.
         */

        chatHistory.push(
          {
            role: "user",
            content: text
          },
          {
            role: "assistant",
            content: reply
          }
        );

        /*
         * 대화 기록이 지나치게 길어지지 않도록 제한
         */
        if (chatHistory.length > 40) {
          chatHistory =
            chatHistory.slice(-40);
        }

        aiReplyText.textContent = reply;

      } catch (error) {
        console.error(
          "AI 처리 오류:",
          error
        );

        showError(
          "AI 처리 오류: " +
          (error?.message || "알 수 없는 오류")
        );
      } finally {
        isSending = false;
        sendBtn.disabled = false;
        loading.classList.add("hidden");
      }
    }

    sendBtn.addEventListener(
      "click",
      sendMessage
    );

    textInput.addEventListener(
      "keydown",
      event => {
        if (
          event.key === "Enter" &&
          !event.shiftKey
        ) {
          event.preventDefault();
          sendMessage();
        }
      }
    );
  </script>
</body>
</html>
