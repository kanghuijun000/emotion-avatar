<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Emotion Synchronized AI Avatar</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Puter.js SDK -->
  <script src="https://js.puter.com/v2/"></script>
  <style>
    body { touch-action: manipulation; }
  </style>
</head>
<body class="bg-slate-950 text-white min-h-[100dvh] flex flex-col items-center justify-center p-4">

  <div class="w-full max-w-xs flex flex-col items-center gap-4 my-auto">
    <!-- 2D 아바타 캔버스 -->
    <div class="relative">
      <canvas id="faceCanvas" width="220" height="220" class="rounded-3xl bg-slate-900 border border-slate-800 shadow-xl"></canvas>
      <div id="loading" class="hidden absolute -bottom-5 left-0 right-0 text-center text-[11px] text-sky-400 animate-pulse font-semibold">AI 표정 분석 및 맞춤 말투 생성 중...</div>
    </div>

    <!-- AI 대답 말풍선 -->
    <div id="aiReplyBox" class="w-full bg-sky-950/40 border border-sky-800/50 rounded-2xl p-3.5 min-h-[70px] flex flex-col justify-center transition-all">
      <div class="text-[10px] text-sky-400 font-semibold mb-1 flex items-center gap-1">
        <span>🤖 AI 아바타의 대답</span>
      </div>
      <p id="aiReplyText" class="text-xs text-slate-200 leading-relaxed break-keep">
        메시지를 입력하시면 감정에 완전히 동화된 말투로 대답해 드려요!
      </p>
    </div>

    <!-- 텍스트 입력창 -->
    <div class="w-full space-y-2">
      <textarea id="textInput" placeholder="메시지를 입력해보세요 (예: 부장님이 또 야근시키네 진짜 열받아, 밤길에 뒤에서 이상한 소리가 들려...)" rows="3" class="w-full bg-slate-900 border border-slate-800 rounded-2xl p-3 text-xs text-white placeholder-slate-500 focus:outline-none focus:border-sky-500 resize-none shadow-inner"></textarea>
      
      <!-- 에러 출력창 -->
      <div id="errorBox" class="hidden text-[11px] text-red-400 bg-red-950/50 border border-red-800/50 rounded-xl p-2.5 break-all"></div>
    </div>

    <!-- 감정 수치 HUD -->
    <div class="w-full bg-slate-900/80 border border-slate-800 rounded-2xl p-3 space-y-2" id="gaugeBox">
    </div>
  </div>

  <script>
    const canvas = document.getElementById('faceCanvas');
    const ctx = canvas.getContext('2d');
    
    // 기본 감정 데이터
    let targetEmotions = { happy: 0, sad: 0, angry: 0, surprised: 0, fear: 0, disgust: 0, neutral: 1 };
    let currentEmotions = { ...targetEmotions };

    // 파티클 관리
    let particles = [];
    let frameCount = 0;

    // UI 동적 생성
    function renderGauges() {
      const box = document.getElementById('gaugeBox');
      box.innerHTML = Object.keys(targetEmotions).map(key => `
        <div class="space-y-0.5">
          <div class="flex justify-between text-[11px] text-slate-300 capitalize">
            <span>${key}</span>
            <span id="val-${key}" class="text-sky-400">0%</span>
          </div>
          <div class="w-full bg-slate-800 h-1.5 rounded-full overflow-hidden">
            <div id="bar-${key}" class="bg-sky-500 h-full transition-all duration-300" style="width: 0%"></div>
          </div>
        </div>
      `).join('');
    }
    renderGauges();

    // 캔버스 정밀 렌더링 루프
    function draw() {
      frameCount++;
      const lerp = (a, b) => a + (b - a) * 0.12;

      // 감정 수치 보간
      for (let k in targetEmotions) {
        currentEmotions[k] = lerp(currentEmotions[k], targetEmotions[k]);
        const percent = Math.round(currentEmotions[k] * 100);
        if (document.getElementById(`val-${k}`)) {
          document.getElementById(`val-${k}`).innerText = percent + '%';
          document.getElementById(`bar-${k}`).style.width = percent + '%';
        }
      }

      const e = currentEmotions;
      const width = canvas.width, height = canvas.height;
      let cx = width / 2;
      let cy = height / 2;

      // 가장 우세한 핵심 감정 선별
      let dominant = 'neutral';
      let maxVal = 0;
      for (let k in e) {
        if (e[k] > maxVal) {
          maxVal = e[k];
          dominant = k;
        }
      }

      // 공포(Fear) 셰이킹
      if (e.fear > 0.3) {
        const shakeIntensity = Math.min(e.fear * 5, 4);
        cx += (Math.random() - 0.5) * shakeIntensity;
        cy += (Math.random() - 0.5) * shakeIntensity;
      }

      ctx.clearRect(0, 0, width, height);

      // 감정 파티클 생성
      if (particles.length < 25) {
        if (e.happy > 0.4 && frameCount % 15 === 0) {
          particles.push({ type: 'heart', x: cx + (Math.random() - 0.5) * 110, y: cy + 40, size: 10 + Math.random() * 6, vy: -1.2, alpha: 1 });
        }
        if (e.sad > 0.4 && frameCount % 8 === 0) {
          particles.push({ type: 'rain', x: cx + (Math.random() - 0.5) * 130, y: cy - 65, vy: 4 + Math.random() * 2, length: 8, alpha: 0.8 });
        }
        if (e.angry > 0.4 && frameCount % 6 === 0) {
          particles.push({ type: 'fire', x: cx + (Math.random() - 0.5) * 120, y: cy + 55, size: 6 + Math.random() * 6, vy: -2, vx: (Math.random() - 0.5), alpha: 1 });
        }
      }

      // 파티클 업데이트
      for (let i = particles.length - 1; i >= 0; i--) {
        let p = particles[i];
        if (p.type === 'heart') {
          p.y += p.vy; p.alpha -= 0.015;
          ctx.fillStyle = `rgba(244, 114, 182, ${Math.max(0, p.alpha)})`;
          ctx.font = `${p.size}px sans-serif`;
          ctx.fillText('♥', p.x, p.y);
        } else if (p.type === 'rain') {
          p.y += p.vy; p.alpha -= 0.025;
          ctx.strokeStyle = `rgba(56, 189, 248, ${Math.max(0, p.alpha)})`;
          ctx.lineWidth = 2;
          ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p.x, p.y + p.length); ctx.stroke();
        } else if (p.type === 'fire') {
          p.y += p.vy; p.x += p.vx; p.alpha -= 0.035;
          ctx.fillStyle = `rgba(239, 68, 68, ${Math.max(0, p.alpha)})`;
          ctx.beginPath(); ctx.arc(p.x, p.y, Math.max(1, p.size * p.alpha), 0, Math.PI * 2); ctx.fill();
        }
        if (p.alpha <= 0 || p.y < 0 || p.y > height) particles.splice(i, 1);
      }

      // 아바타 그려주기
      ctx.beginPath();
      ctx.arc(cx, cy, 75, 0, Math.PI * 2);
      ctx.fillStyle = '#facc15';
      ctx.fill();

      // Fear 그림자
      if (e.fear > 0.25) {
        ctx.save();
        ctx.beginPath(); ctx.arc(cx, cy, 75, 0, Math.PI * 2); ctx.clip();
        ctx.fillStyle = `rgba(30, 58, 138, ${Math.min(0.6, e.fear * 0.6)})`;
        ctx.fillRect(cx - 75, cy - 75, 150, 60);
        ctx.restore();
      }

      // Happy 볼터치
      if (e.happy > 0.2) {
        ctx.fillStyle = `rgba(244, 63, 94, ${Math.min(0.7, e.happy * 0.7)})`;
        ctx.beginPath(); ctx.arc(cx - 42, cy + 10, 14, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.arc(cx + 42, cy + 10, 14, 0, Math.PI * 2); ctx.fill();
      }

      // 눈
      ctx.lineWidth = 4;
      ctx.strokeStyle = '#0f172a';

      const drawEye = (isLeft) => {
        const eyeCx = isLeft ? cx - 28 : cx + 28;
        if (e.happy > 0.65) {
          ctx.beginPath();
          ctx.arc(eyeCx, cy - 8, 10, Math.PI * 1.1, Math.PI * 1.9);
          ctx.stroke();
        } else {
          const eyeR = Math.min(15, Math.max(3, 7 + (e.surprised * 7) - (e.disgust * 2)));
          ctx.beginPath();
          ctx.arc(eyeCx, cy - 14, eyeR, 0, Math.PI * 2);
          ctx.fillStyle = (e.angry > 0.5) ? '#dc2626' : '#0f172a';
          ctx.fill();
        }
      };
      drawEye(true);
      drawEye(false);

      // 눈썹
      ctx.lineWidth = 5;
      ctx.lineCap = 'round';
      ctx.strokeStyle = '#0f172a';

      const rawEyOffY = (e.sad * 8) - (e.angry * 8) - (e.surprised * 10);
      const eyOffY = Math.max(-14, Math.min(10, rawEyOffY));
      const rawTilt = (e.angry * 0.35) - (e.sad * 0.35);
      const eyTilt = Math.max(-0.4, Math.min(0.4, rawTilt));

      ctx.beginPath();
      ctx.moveTo(cx - 48, cy - 35 + eyOffY - eyTilt * 15);
      ctx.lineTo(cx - 10, cy - 35 + eyOffY + eyTilt * 15);
      ctx.stroke();

      ctx.beginPath();
      ctx.moveTo(cx + 10, cy - 35 + eyOffY + eyTilt * 15);
      ctx.lineTo(cx + 48, cy - 35 + eyOffY - eyTilt * 15);
      ctx.stroke();

      // 입 모양
      ctx.beginPath();
      if (dominant === 'surprised' && e.surprised > 0.45) {
        const mouthR = Math.min(20, 8 + e.surprised * 10);
        ctx.arc(cx, cy + 28, mouthR, 0, Math.PI * 2);
        ctx.fillStyle = '#0f172a';
        ctx.fill();
      } else if (dominant === 'fear' && e.fear > 0.45) {
        ctx.moveTo(cx - 24, cy + 28);
        ctx.quadraticCurveTo(cx - 12, cy + 22, cx, cy + 28);
        ctx.quadraticCurveTo(cx + 12, cy + 34, cx + 24, cy + 28);
        ctx.stroke();
      } else if (dominant === 'disgust' && e.disgust > 0.45) {
        ctx.moveTo(cx - 24, cy + 24);
        ctx.lineTo(cx + 24, cy + 32);
        ctx.stroke();
      } else {
        const rawCurve = (e.happy * 30) - (e.sad * 28) - (e.angry * 16);
        const mouthCurve = Math.max(-28, Math.min(30, rawCurve));
        ctx.moveTo(cx - 28, cy + 26);
        ctx.quadraticCurveTo(cx, cy + 26 + mouthCurve, cx + 28, cy + 26);
        ctx.stroke();
      }

      // 상단 이펙트
      if (dominant === 'sad' && e.sad > 0.45) {
        ctx.fillStyle = 'rgba(100, 116, 139, 0.8)';
        ctx.beginPath();
        ctx.arc(cx - 22, cy - 80, 16, 0, Math.PI * 2);
        ctx.arc(cx, cy - 86, 22, 0, Math.PI * 2);
        ctx.arc(cx + 22, cy - 80, 16, 0, Math.PI * 2);
        ctx.fill();
      } else if (dominant === 'surprised' && e.surprised > 0.45) {
        const bounce = Math.sin(frameCount * 0.2) * 3;
        ctx.fillStyle = '#f59e0b';
        ctx.font = 'bold 24px sans-serif';
        ctx.fillText('!', cx - 4, cy - 82 + bounce);
      }

      requestAnimationFrame(draw);
    }
    draw();

    // AI API 호출
    let timer;
    const errorBox = document.getElementById('errorBox');
    const aiReplyText = document.getElementById('aiReplyText');
    
    function showError(msg) {
      errorBox.innerText = msg;
      errorBox.classList.remove('hidden');
    }
    function hideError() {
      errorBox.innerText = '';
      errorBox.classList.add('hidden');
    }

    document.getElementById('textInput').addEventListener('input', (evt) => {
      clearTimeout(timer);
      hideError();

      const text = evt.target.value.trim();

      if (!text) {
        targetEmotions = { happy: 0, sad: 0, angry: 0, surprised: 0, fear: 0, disgust: 0, neutral: 1 };
        aiReplyText.innerText = "메시지를 입력하시면 감정에 완전히 동화된 말투로 대답해 드려요!";
        return;
      }

      timer = setTimeout(async () => {
        document.getElementById('loading').classList.remove('hidden');

        try {
          const prompt = `당신은 사용자의 감정에 완전히 연동되어 반응하는 AI 아바타입니다.
사용자의 입력 문장: "${text}"

[1단계: 감정 측정]
문장의 감정 수치(happy, sad, angry, surprised, fear, disgust, neutral)를 0.0 ~ 1.0 사이로 평가하세요.

[2단계: 감정 기반 말투 및 답변 작성 (매우 중요!)]
측정된 감정 중 가장 높은 감정에 맞추어 **반드시 완전히 몰입된 말투**로 1~2문장의 답변(reply)을 작성하세요:
- **angry(분노)가 높다면**: 같이 엄청 화내고 짜증 내거나 억울해하는 말투로 답변 (예: "뭐?! 진짜 너무한 거 아니야?! 나까지 열받네!")
- **fear(공포/무서움)가 높다면**: 겁에 질리거나 덜덜 떨며 당황하는 말투로 답변 (예: "히익...! 너무 무섭잖아... 나 지금 소름 돋았어...")
- **sad(슬픔)가 높다면**: 눈물 흘리며 같이 슬퍼하거나 흑흑거리는 말투로 답변 (예: "흑흑... 진짜 너무 슬프다... 어떡해...")
- **happy(기쁨)가 높다면**: 아주 신나고 기분 좋게 텐션 높은 말투로 답변 (예: "와!! 너무 잘됐다!! 듣기만 해도 기분 완전 좋아!")
- **surprised(놀람)가 높다면**: 깜짝 놀라 억 소리 나는 반응의 말투로 답변 (예: "헐, 대박! 진짜로?! 그게 정말이야?!")
- **disgust(혐오)가 높다면**: 으 질색하거나 인상 쓰는 말투로 답변 (예: "으... 생각만 해도 인상 쓰여... 너무 별로다...")

반드시 아래 JSON 형식으로만 응답하세요:
{
  "emotions": {
    "happy": 0.0,
    "sad": 0.0,
    "angry": 0.0,
    "surprised": 0.0,
    "fear": 0.0,
    "disgust": 0.0,
    "neutral": 1.0
  },
  "reply": "감정에 맞춘 AI 답변"
}`;

          const response = await puter.ai.chat(prompt);
          const responseText = response.toString().trim();

          const jsonMatch = responseText.match(/\{[\s\S]*\}/);
          if (!jsonMatch) {
            throw new Error("AI 응답 형식을 처리할 수 없습니다.");
          }

          const parsed = JSON.parse(jsonMatch[0]);
          
          if (parsed.emotions) {
            targetEmotions = {
              happy: Number(parsed.emotions.happy) || 0,
              sad: Number(parsed.emotions.sad) || 0,
              angry: Number(parsed.emotions.angry) || 0,
              surprised: Number(parsed.emotions.surprised) || 0,
              fear: Number(parsed.emotions.fear) || 0,
              disgust: Number(parsed.emotions.disgust) || 0,
              neutral: Number(parsed.emotions.neutral) || 0
            };
          }

          if (parsed.reply) {
            aiReplyText.innerText = parsed.reply;
          }

        } catch (err) {
          console.error(err);
          showError("AI 처리 오류: " + err.message);
        } finally {
          document.getElementById('loading').classList.add('hidden');
        }
      }, 700);
    });
  </script>
</body>
</html>
