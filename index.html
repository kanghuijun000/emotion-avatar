<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Realtime 2D Emotion Avatar (Puter AI)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Puter.js SDK (API 키 없이 AI를 직접 호출할 수 있게 해주는 라이브러리) -->
  <script src="https://js.puter.com/v2/"></script>
  <style>
    body { touch-action: manipulation; }
  </style>
</head>
<body class="bg-slate-950 text-white min-h-[100dvh] flex flex-col items-center justify-center p-4">

  <div class="w-full max-w-xs flex flex-col items-center gap-4 my-auto">
    <!-- 2D 아바타 캔버스 -->
    <div class="relative">
      <canvas id="faceCanvas" width="220" height="220" class="rounded-3xl bg-slate-900 border border-slate-800 shadow-lg"></canvas>
      <div id="loading" class="hidden absolute -bottom-5 left-0 right-0 text-center text-[11px] text-sky-400 animate-pulse font-semibold">AI 감정 분석 중...</div>
    </div>

    <!-- 텍스트 입력창 (API 키 입력란 완전히 삭제됨) -->
    <div class="w-full space-y-2">
      <textarea id="textInput" placeholder="메시지를 입력해보세요 (예: 시험 끝났다!, 오늘 휴대폰 변기에 빠뜨림...)" rows="3" class="w-full bg-slate-900 border border-slate-800 rounded-2xl p-3 text-xs text-white placeholder-slate-500 focus:outline-none focus:border-sky-500 resize-none shadow-inner"></textarea>
      
      <!-- 에러 출력창 -->
      <div id="errorBox" class="hidden text-[11px] text-red-400 bg-red-950/50 border border-red-800/50 rounded-xl p-2.5 break-all"></div>
    </div>

    <!-- 감정 수치 HUD -->
    <div class="w-full bg-slate-900/80 border border-slate-800 rounded-2xl p-3 space-y-2" id="gaugeBox">
    </div>
  </div>

  <script>
    const canvas = document.getElementById('faceCanvas');
    const ctx = canvas.getContext('2d');
    
    // 기본 감정 데이터
    let targetEmotions = { happy: 0, sad: 0, angry: 0, surprised: 0, fear: 0, disgust: 0, neutral: 1 };
    let currentEmotions = { ...targetEmotions };

    // UI 동적 생성
    function renderGauges() {
      const box = document.getElementById('gaugeBox');
      box.innerHTML = Object.keys(targetEmotions).map(key => `
        <div class="space-y-0.5">
          <div class="flex justify-between text-[11px] text-slate-300 capitalize">
            <span>${key}</span>
            <span id="val-${key}" class="text-sky-400">0%</span>
          </div>
          <div class="w-full bg-slate-800 h-1.5 rounded-full overflow-hidden">
            <div id="bar-${key}" class="bg-sky-500 h-full transition-all duration-300" style="width: 0%"></div>
          </div>
        </div>
      `).join('');
    }
    renderGauges();

    // 캔버스 그리기 루프
    function draw() {
      const lerp = (a, b) => a + (b - a) * 0.12;
      for (let k in targetEmotions) {
        currentEmotions[k] = lerp(currentEmotions[k], targetEmotions[k]);
        const percent = Math.round(currentEmotions[k] * 100);
        if (document.getElementById(`val-${k}`)) {
          document.getElementById(`val-${k}`).innerText = percent + '%';
          document.getElementById(`bar-${k}`).style.width = percent + '%';
        }
      }

      const e = currentEmotions;
      const width = canvas.width, height = canvas.height;
      const cx = width / 2, cy = height / 2;

      ctx.clearRect(0, 0, width, height);

      // 얼굴
      ctx.beginPath();
      ctx.arc(cx, cy, 75, 0, Math.PI * 2);
      ctx.fillStyle = '#facc15';
      ctx.fill();

      // 눈
      const eyeSize = 7 + e.surprised * 9;
      ctx.fillStyle = '#0f172a';
      ctx.beginPath(); ctx.arc(cx - 28, cy - 14, eyeSize, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(cx + 28, cy - 14, eyeSize, 0, Math.PI * 2); ctx.fill();

      // 눈썹
      ctx.lineWidth = 5; ctx.strokeStyle = '#0f172a'; ctx.lineCap = 'round';
      const offsetY = (e.sad * 6) - (e.angry * 6) - (e.surprised * 10);
      const tilt = (e.angry * 0.35) - (e.sad * 0.35);

      ctx.beginPath();
      ctx.moveTo(cx - 48, cy - 35 + offsetY - tilt * 15);
      ctx.lineTo(cx - 10, cy - 35 + offsetY + tilt * 15);
      ctx.stroke();

      ctx.beginPath();
      ctx.moveTo(cx + 10, cy - 35 + offsetY + tilt * 15);
      ctx.lineTo(cx + 48, cy - 35 + offsetY - tilt * 15);
      ctx.stroke();

      // 입
      ctx.beginPath();
      if (e.surprised > 0.4) {
        ctx.arc(cx, cy + 28, 8 + e.surprised * 12, 0, Math.PI * 2);
        ctx.fillStyle = '#0f172a'; ctx.fill();
      } else {
        const curve = (e.happy * 30) - (e.sad * 30) - (e.angry * 15);
        ctx.moveTo(cx - 32, cy + 28);
        ctx.quadraticCurveTo(cx, cy + 28 + curve, cx + 32, cy + 28);
        ctx.stroke();
      }

      requestAnimationFrame(draw);
    }
    draw();

    // AI API 호출 (Puter.js 이용)
    let timer;
    const errorBox = document.getElementById('errorBox');
    
    function showError(msg) {
      errorBox.innerText = msg;
      errorBox.classList.remove('hidden');
    }
    function hideError() {
      errorBox.innerText = '';
      errorBox.classList.add('hidden');
    }

    document.getElementById('textInput').addEventListener('input', (evt) => {
      clearTimeout(timer);
      hideError();

      const text = evt.target.value.trim();

      if (!text) {
        targetEmotions = { happy: 0, sad: 0, angry: 0, surprised: 0, fear: 0, disgust: 0, neutral: 1 };
        return;
      }

      timer = setTimeout(async () => {
        document.getElementById('loading').classList.remove('hidden');

        try {
          const prompt = `다음 문장을 분석하여 감정 수치(happy, sad, angry, surprised, fear, disgust, neutral)를 0.0 ~ 1.0 사이의 값으로 구하세요.
          문맥과 뉘앙스를 고려하세요.
          응답은 무조건 오직 아래 JSON 형태 하나만 출력하세요. 다른 말은 절대로 덧붙이지 마세요:
          {"happy": 0.0, "sad": 0.0, "angry": 0.0, "surprised": 0.0, "fear": 0.0, "disgust": 0.0, "neutral": 1.0}
          
          문장: "${text}"`;

          // Puter.js로 키 없이 AI 모델 직접 호출
          const response = await puter.ai.chat(prompt);
          const responseText = response.toString().trim();

          // JSON 파싱 (코드 블록 기호 제거 처리)
          const jsonMatch = responseText.match(/\{[\s\S]*\}/);
          if (!jsonMatch) {
            throw new Error("AI 결과 데이터를 읽을 수 없습니다.");
          }

          const parsed = JSON.parse(jsonMatch[0]);
          
          targetEmotions = {
            happy: Number(parsed.happy) || 0,
            sad: Number(parsed.sad) || 0,
            angry: Number(parsed.angry) || 0,
            surprised: Number(parsed.surprised) || 0,
            fear: Number(parsed.fear) || 0,
            disgust: Number(parsed.disgust) || 0,
            neutral: Number(parsed.neutral) || 0
          };

        } catch (err) {
          console.error(err);
          showError("AI 분석 오류: " + err.message);
        } finally {
          document.getElementById('loading').classList.add('hidden');
        }
      }, 600);
    });
  </script>
</body>
</html>
